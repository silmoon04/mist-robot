[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 460800
lib_deps =
  https://github.com/ftservo/FTServo_Arduino.git#64922cda46e56b21b8c1d9e830d936a1941645ae
  bblanchon/ArduinoJson@6.21.5
build_flags = -Wall -Wextra

[env:esp32dev_mpu6050]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DMIST_MPU6050=1
