<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIST / Thinking studies v8</title><link rel="stylesheet" href="style.css?v=5bf0b207488dc326"></head>
<body>
<header><a class="brand" href="../handdrawn_v6/">MIST</a><span>Thinking studies v8</span><span id="status" role="status">Loading drawings</span><a href="MIST_thinking_v8.zip" download>Download pack</a></header>
<main>
<div class="toolbar"><button id="play">Pause</button><button id="step">Step</button><button id="blink">Blink</button><button id="enter">Replay entrances</button><button id="exit">Exit</button><label>Speed <select id="speed"><option value=".25">0.25x</option><option value=".5">0.5x</option><option value="1" selected>1x</option></select></label><label class="compare"><input type="checkbox" id="comparison"> Drawing loop only</label><span class="rate">15 fps</span></div>
<div class="toolbar secondary"><label>Voice <select id="voice-sample"><option>Loading</option></select></label><button id="voice-play" disabled>Play recording</button><button id="voice-stop" disabled>Stop voice</button><span id="voice-status">Saved MIST voice</span><label>Face <select id="expression"><option value="auto" selected>Auto variations</option></select></label></div>
<p id="error" role="alert" hidden></p>
<section id="grid" aria-label="Eight thinking animations"></section>
<footer><span>Original MIST faces. Three automatic variations.</span><a href="../thinking_v7/">Compare v7</a></footer>
</main>
<dialog id="inspector"><div class="dialog-head"><span id="inspect-name"></span><button id="close">Close</button></div>
<canvas id="focus" width="1000" height="640" aria-label="Selected animation"></canvas>
<div class="toolbar"><button id="inspect-play">Pause</button><button id="inspect-step">Step</button><button id="inspect-blink">Blink</button><button id="inspect-follow">Follow animation</button><button id="inspect-replay">Replay</button><button id="inspect-exit">Exit</button><label>Layer <select id="layers"><option value="all">Together</option><option value="eyes">Eyes</option><option value="mouth">Mouth</option><option value="activity">Activity</option></select></label></div>
<div class="phase" id="phase"></div><div id="beat-strip" class="beats" aria-label="Activity beats"></div>
<div class="strip-label">4 entrance / 16 work / 4 exit frames</div><div id="activity-strip" class="strip"></div>
</dialog>
<script src="../runtime/app_data.js"></script><script src="../runtime/face_runtime.js"></script><script src="../runtime/drawn_face_renderer.js?v=thinking8"></script><script src="runtime.js?v=0a08259942ac3fa3"></script><script src="preview.js?v=3653d9140510b0de"></script>
</body></html>
