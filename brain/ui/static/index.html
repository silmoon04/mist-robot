<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIST · console</title>
<style>
  :root{
    --bg:#070b0f; --bg2:#0b1116; --panel:#0e161d; --panel2:#111d26;
    --edge:#183040; --edge2:#20465b;
    --ink:#cfe9f2; --ink-dim:#7fa4b4; --ink-faint:#4d6b78;
    --cyan:#22e3ff; --cyan-deep:#0bb6d6; --cyan-glow:rgba(34,227,255,.35);
    --user:#123244; --user-edge:#1d5871;
    --bot:#0f1a22; --bot-edge:#1c3341;
    --red:#ff5b6e; --red-bg:#2a1116; --amber:#ffc24b; --green:#39e6a0;
    --mono:'SFMono-Regular',ui-monospace,'Cascadia Code','Consolas',monospace;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{
    margin:0;font-family:var(--sans);color:var(--ink);
    background:
      radial-gradient(1200px 600px at 12% -10%,rgba(34,227,255,.06),transparent 60%),
      radial-gradient(900px 500px at 100% 110%,rgba(34,227,255,.05),transparent 60%),
      var(--bg);
    display:flex;flex-direction:column;overflow:hidden;
    font-size:14px;line-height:1.5;
  }
  a{color:var(--cyan)}
  ::selection{background:var(--cyan-glow)}

  /* ---------- header ---------- */
  header{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:10px 16px;border-bottom:1px solid var(--edge);
    background:linear-gradient(180deg,var(--bg2),transparent);
    backdrop-filter:blur(4px);z-index:5;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.5px}
  .brand .logo{
    width:26px;height:26px;border-radius:7px;
    background:radial-gradient(circle at 30% 30%,var(--cyan),var(--cyan-deep));
    box-shadow:0 0 14px var(--cyan-glow),inset 0 0 6px rgba(255,255,255,.4);
    position:relative;flex:none;
  }
  .brand .logo::before,.brand .logo::after{
    content:"";position:absolute;top:9px;width:5px;height:8px;border-radius:3px;
    background:#04141a;box-shadow:0 0 3px #04141a;
  }
  .brand .logo::before{left:6px} .brand .logo::after{right:6px}
  .brand small{color:var(--ink-faint);font-weight:500;letter-spacing:2px;font-size:10px}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    padding:4px 10px;border-radius:999px;font-size:12px;
    border:1px solid var(--edge2);background:var(--panel);color:var(--ink-dim);
    font-family:var(--mono);white-space:nowrap;
  }
  .chip b{color:var(--ink)}
  .badge{
    text-transform:uppercase;font-size:10px;letter-spacing:1.5px;font-weight:700;
    padding:4px 9px;border-radius:6px;border:1px solid var(--cyan-deep);
    color:var(--cyan);background:rgba(34,227,255,.08);
  }
  .badge.watch{border-color:var(--amber);color:var(--amber);background:rgba(255,194,75,.08)}
  .spacer{flex:1}
  .conn{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-dim);font-family:var(--mono)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--ink-faint);transition:.3s}
  .dot.live{background:var(--green);box-shadow:0 0 8px var(--green)}
  .dot.dead{background:var(--red);box-shadow:0 0 8px var(--red)}
  select,button,input{font-family:inherit}
  .btn{
    padding:6px 12px;border-radius:7px;border:1px solid var(--edge2);
    background:var(--panel2);color:var(--ink);cursor:pointer;font-size:12px;
    transition:.15s;
  }
  .btn:hover{border-color:var(--cyan-deep);color:var(--cyan)}
  .btn:active{transform:translateY(1px)}
  .sel{
    padding:5px 8px;border-radius:7px;border:1px solid var(--edge2);
    background:var(--panel2);color:var(--ink);font-size:12px;
  }

  /* ---------- layout ---------- */
  main{flex:1;display:flex;min-height:0}
  .facepane{
    width:44%;max-width:640px;min-width:380px;
    border-right:1px solid var(--edge);background:#04080b;
    display:flex;flex-direction:column;position:relative;
  }
  .face-display{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#04080b;padding:20px}
  .face-display svg{width:100%;max-height:100%;aspect-ratio:1}
  .jobs{max-height:220px;overflow:auto;padding:0 16px;border-top:1px solid var(--edge)}
  .job{padding:10px 0;border-bottom:1px solid var(--edge);font-size:12px}
  .job strong{color:var(--cyan)}
  .job p{margin:4px 0;white-space:pre-wrap}
  .job small{color:var(--ink-dim)}
  .composer-actions{display:flex;flex-direction:column;gap:6px}
  .facebar{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:8px 12px;border-top:1px solid var(--edge);
    background:var(--bg2);font-size:12px;color:var(--ink-dim);
    font-family:var(--mono);
  }
  .facebar .lbl{color:var(--ink-faint)}
  .facebar b{color:var(--cyan)}

  .chatpane{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}

  /* status strip */
  .status{
    display:flex;gap:14px;flex-wrap:wrap;align-items:center;
    padding:8px 16px;border-bottom:1px solid var(--edge);
    background:linear-gradient(180deg,var(--panel),transparent);
    font-family:var(--mono);font-size:12px;color:var(--ink-dim);
  }
  .status .stat{display:flex;align-items:center;gap:6px}
  .status .stat .k{color:var(--ink-faint);font-size:10px;text-transform:uppercase;letter-spacing:1px}
  .status .stat .v{color:var(--ink)}
  .status .stat .v.warn{color:var(--amber)} .status .stat .v.bad{color:var(--red)}
  .status .bat{position:relative;width:34px;height:13px;border:1px solid var(--edge2);border-radius:3px;overflow:hidden}
  .status .bat::after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;background:var(--edge2)}
  .status .bat i{display:block;height:100%;background:var(--green);transition:.4s}

  /* chat log */
  .log{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
  .log::-webkit-scrollbar{width:9px}
  .log::-webkit-scrollbar-thumb{background:var(--edge2);border-radius:9px}
  .row{display:flex;flex-direction:column;max-width:78%}
  .row.user{align-self:flex-end;align-items:flex-end}
  .row.bot{align-self:flex-start;align-items:flex-start}
  .bubble{
    padding:9px 13px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word;
    border:1px solid var(--bot-edge);background:var(--bot);position:relative;
  }
  .row.user .bubble{
    background:var(--user);border-color:var(--user-edge);border-bottom-right-radius:4px;
  }
  .row.bot .bubble{border-bottom-left-radius:4px}
  .row.bot .bubble.streaming::after{
    content:"▋";color:var(--cyan);animation:blink 1s steps(2) infinite;margin-left:1px;
  }
  @keyframes blink{50%{opacity:0}}
  .who{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint);margin:0 4px 3px}
  .row.bot .who{color:var(--cyan-deep)}

  .tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .tool{
    display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;
    padding:3px 8px;border-radius:6px;border:1px solid var(--edge2);
    background:rgba(34,227,255,.05);color:var(--ink);
  }
  .tool .tn{color:var(--cyan);font-weight:600}
  .tool .ta{color:var(--ink-dim)}
  .tool.pending{opacity:.65;border-style:dashed}
  .tool.err{border-color:var(--red);background:var(--red-bg);color:var(--red)}
  .tool.err .tn{color:var(--red)}
  .metrics{margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
  .metrics b{color:var(--ink-dim)}

  .note{align-self:center;font-family:var(--mono);font-size:11px;color:var(--ink-faint);
    border:1px dashed var(--edge2);border-radius:8px;padding:4px 12px;background:var(--panel)}

  /* composer */
  .composer{
    display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--edge);
    background:linear-gradient(0deg,var(--bg2),transparent);
  }
  .composer textarea{
    flex:1;resize:none;height:44px;max-height:140px;padding:11px 13px;
    border-radius:10px;border:1px solid var(--edge2);background:var(--panel);
    color:var(--ink);font-size:14px;font-family:inherit;line-height:1.4;
  }
  .composer textarea:focus{outline:none;border-color:var(--cyan-deep);box-shadow:0 0 0 3px rgba(34,227,255,.12)}
  .composer textarea:disabled{opacity:.5}
  .send{
    padding:0 20px;border-radius:10px;border:1px solid var(--cyan-deep);
    background:linear-gradient(180deg,var(--cyan),var(--cyan-deep));color:#03181e;
    font-weight:700;cursor:pointer;font-size:14px;transition:.15s;
  }
  .send:hover{box-shadow:0 0 16px var(--cyan-glow)}
  .send:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}

  /* mic / push-to-talk */
  .miccol{display:flex;flex-direction:column;align-items:center;gap:3px;justify-content:center}
  .micbtn{
    width:44px;height:44px;border-radius:10px;border:1px solid var(--edge2);
    background:var(--panel2);color:var(--ink);font-size:18px;cursor:pointer;
    transition:.15s;line-height:1;flex:none;
  }
  .micbtn:hover{border-color:var(--cyan-deep)}
  .micbtn:disabled{opacity:.35;cursor:not-allowed}
  .micbtn.rec{
    border-color:var(--red);color:#fff;background:var(--red);
    animation:recpulse 1s ease-in-out infinite;
  }
  .micbtn.busy{border-color:var(--amber);color:var(--amber)}
  #btnTalk[aria-pressed="true"]{background:var(--red-bg);border-color:var(--red);color:var(--red)}
  #talkStatus{font-size:10px;color:var(--ink-dim);max-width:110px;text-align:center}
  @keyframes recpulse{50%{box-shadow:0 0 0 5px rgba(255,91,110,.25)}}
  .autos{font-family:var(--mono);font-size:9px;color:var(--ink-faint);
    display:flex;align-items:center;gap:2px;cursor:pointer;user-select:none}
  .autos input{width:11px;height:11px;accent-color:var(--cyan)}

  /* voice picker */
  #voiceSel{max-width:150px}
  #voiceWrap[hidden]{display:none}
  #btnPreview{padding:5px 8px;font-size:11px}

  /* sim panel */
  details.sim{border-top:1px solid var(--edge);background:var(--bg2)}
  details.sim>summary{
    cursor:pointer;padding:8px 16px;font-family:var(--mono);font-size:12px;
    color:var(--ink-dim);list-style:none;user-select:none;
  }
  details.sim>summary::-webkit-details-marker{display:none}
  details.sim>summary::before{content:"▸ ";color:var(--cyan-deep)}
  details.sim[open]>summary::before{content:"▾ "}
  .simgrid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;
    padding:4px 16px 14px;
  }
  .simctl{display:flex;flex-direction:column;gap:5px}
  .simctl label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-faint);font-family:var(--mono)}
  .simctl .val{color:var(--cyan);font-family:var(--mono)}
  .simctl input[type=range]{width:100%;accent-color:var(--cyan)}
  .simctl input[type=number],.simctl select{
    padding:6px 8px;border-radius:6px;border:1px solid var(--edge2);
    background:var(--panel);color:var(--ink);font-family:var(--mono);font-size:12px;
  }

  /* watch feed */
  .watchfeed{display:none;flex-direction:column;gap:8px;padding:14px 16px;overflow-y:auto;flex:1}
  body.watch .composer{display:none}
  body.watch .watchfeed{display:flex}
  .benchrow{
    display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:9px;
    border:1px solid var(--edge2);background:var(--panel);font-family:var(--mono);font-size:12px;
  }
  .benchrow .sid{color:var(--ink);font-weight:600;flex:1}
  .benchrow .verdict{padding:2px 9px;border-radius:5px;font-weight:700;font-size:11px;letter-spacing:1px}
  .benchrow .verdict.pass{background:rgba(57,230,160,.12);color:var(--green);border:1px solid var(--green)}
  .benchrow .verdict.fail{background:var(--red-bg);color:var(--red);border:1px solid var(--red)}
  .benchrow .fails{color:var(--red);font-size:11px}
  .benchrow .lat{color:var(--ink-faint)}

  @media(max-width:820px){
    main{flex-direction:column}
    .facepane{width:100%;max-width:none;height:44vh;min-width:0;border-right:0;border-bottom:1px solid var(--edge)}
  }
</style>

<header>
  <div class="brand">
    <span class="logo"></span>
    <span>MIST <small>WHEEL-LEG QUAD</small></span>
  </div>
  <span class="chip" id="chipModel"><b id="mModel">…</b></span>
  <span class="chip"><b id="mExecutive">background …</b></span>
  <label class="conn" id="profileWrap">conversation<select class="sel" id="profileSel" aria-label="Conversation profile"></select></label>
  <label class="conn" title="Persona — the robot's system prompt / character">
    persona
    <select class="sel" id="personaSel"><option>…</option></select>
  </label>
  <span class="badge" id="modeBadge">CHAT / SIMULATION</span>
  <div class="spacer"></div>
  <label class="conn" title="Speech engine">
    speak
    <select class="sel" id="ttsMode">
      <option value="elevenlabs">ElevenLabs · MIST</option>
      <option value="browser">Browser</option>
      <option value="deepgram">Deepgram</option>
      <option value="mute">Mute</option>
    </select>
  </label>
  <label class="conn" id="voiceWrap" title="Deepgram voice">
    <select class="sel" id="voiceSel"></select>
    <select class="sel" id="voiceModel" aria-label="Voice quality" hidden></select>
    <select class="sel" id="ttsRate" title="Speaking speed (pitch preserved)">
      <option value="0.9">0.9×</option>
      <option value="1" selected>1×</option>
      <option value="1.1">1.1×</option>
      <option value="1.2">1.2×</option>
      <option value="1.35">1.35×</option>
      <option value="1.5">1.5×</option>
    </select>
    <button class="btn" id="btnPreview" title="Preview this voice">▶</button>
  </label>
  <label class="conn" id="watchSpeakWrap" style="display:none">
    <input type="checkbox" id="watchSpeak"> speak replies
  </label>
  <div class="conn"><span class="dot" id="dot"></span><span id="connTxt">connecting</span></div>
  <button class="btn" id="btnStop" title="Stop speech and interrupt the reply">Stop reply</button>
  <button class="btn" id="btnNew">New session</button>
</header>

<main>
  <section class="facepane">
    <div id="faceDisplay" class="face-display" role="img" aria-label="MIST face"></div>
    <div class="facebar">
      <span><span class="lbl">expression</span> <b id="faceName">neutral</b></span>
      <span><span class="lbl">gaze</span> <b id="gazeName">forward</b></span>
      <span class="spacer"></span>
      <span class="lbl" id="faceMapNote"></span><span id="speechStatus" aria-live="polite">quiet</span>
      <button class="btn" id="btnPlayReply" hidden>Play reply</button>
      <span class="lbl" id="latencyStatus" title="Time from sending to voice playback"></span>
    </div>
  </section>

  <section class="chatpane">
    <div class="status" id="statusStrip">
      <div class="stat"><span class="k">batt</span><span class="bat"><i id="batBar" style="width:82%"></i></span><span class="v" id="stBatt">82%</span></div>
      <div class="stat"><span class="k">servo</span><span class="v" id="stTemp">44°C</span></div>
      <div class="stat"><span class="k">surface</span><span class="v" id="stSurf">floor</span></div>
      <div class="stat"><span class="k">pos</span><span class="v" id="stPos">0.0, 0.0 ∠0°</span></div>
      <div class="stat"><span class="k">mode</span><span class="v" id="stMode">legs</span></div>
      <div class="stat"><span class="k">face</span><span class="v" id="stFace">neutral</span></div>
      <div class="stat"><span class="k">tickets</span><span class="v" id="stTickets">0</span></div>
    </div>

    <div class="log" id="log"></div>
    <div class="watchfeed" id="watchFeed"></div>
    <section class="jobs" id="jobs" aria-label="Background tasks" aria-live="polite"></section>

    <div class="composer" id="composer">
      <div class="miccol">
        <button class="btn" id="btnTalk" aria-pressed="false" title="Use your microphone and send each utterance when you finish">Talk</button>
        <span id="talkStatus" role="status" aria-live="polite">Mic off</span>
        <button class="micbtn" id="btnMic" title="Click to talk, click again to stop">🎤</button>
        <label class="autos" title="Send automatically after transcription">
          <input type="checkbox" id="autoSend" checked> auto
        </label>
      </div>
      <textarea id="input" placeholder="Talk to MIST…  (Enter to send · 🎤 to speak)"></textarea>
      <div class="composer-actions"><button class="send" id="send">Send</button><button class="btn" id="btnTask" title="Research or write while we keep talking">Background task</button></div>
    </div>

    <details class="sim">
      <summary>Simulated body state</summary>
      <div class="simgrid">
        <div class="simctl">
          <label>battery <span class="val" id="vBatt">82</span>%</label>
          <input type="range" id="simBatt" min="0" max="100" value="82">
        </div>
        <div class="simctl">
          <label>servo temp <span class="val" id="vTemp">44</span>°C</label>
          <input type="range" id="simTemp" min="20" max="90" value="44">
        </div>
        <div class="simctl">
          <label>surface</label>
          <select id="simSurf"><option>floor</option><option>table</option><option>rug</option></select>
        </div>
        <div class="simctl">
          <label>executive delay (ms)</label>
          <input type="number" id="simDelay" min="0" step="500" value="8000">
        </div>
      </div>
    </details>
  </section>
</main>

<script src="/face/app_data.js"></script>
<script src="/static/face_runtime.js"></script>
<script src="/static/speech_player.js?v=3"></script>
<script src="/static/talk_capture.js?v=2"></script>
<script src="/static/stt_stream.js?v=1"></script>
<script src="/static/talk_recognition.js?v=2"></script>
<script src="/static/talk_session.js?v=1"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => { const d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; };

let CONFIG = {face_map:{}, expressions:[], deepgram_available:false, mode:"chat", soul:null};
let VOICES = [], PERSONAS = [], currentVoice = null;
let FACE_READY = false;
let BUSY = false;
const replySlotWaiters=new Set();
const pendingEchoes = [];   // texts this tab sent, awaiting the server's chat_user echo
let autoSpeechRequest = null;
const latencyTraces=new Map();
function newTrace(){
  const trace={id:'ui-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8),started_epoch_ms:Date.now(),events:[]};
  latencyTraces.set(trace.id,trace);
  if(latencyTraces.size>20) latencyTraces.delete(latencyTraces.keys().next().value);
  return trace;
}
function traceEvent(trace,stage,details={}){
  if(!trace) return;
  const elapsed_ms=Date.now()-trace.started_epoch_ms;
  trace.events.push({stage,elapsed_ms,...details});
  $('latencyStatus').dataset.traces=JSON.stringify([...latencyTraces.values()]);
  if(stage==='audio_playing') $('latencyStatus').textContent='voice '+(elapsed_ms/1000).toFixed(1)+'s';
}
let curBot = null;          // {reply, bubble, toolsEl, chips:{}}
let lastBot = null;         // most recently finished turn — catches tool_end events
                            // that the bus tail emits just AFTER turn_end
const seenTools = new Set();

/* ---------------- face and speech ---------------- */
const face = MistFaceRuntime.create($('faceDisplay'), {data:window.MIST_DATA});
FACE_READY = true;
function pickFaceId(expression){
  const entry=(CONFIG.face_map||{})[expression];
  return typeof entry==='string'?entry:entry?.primary;
}
function showFace(expression){
  $('faceName').textContent=expression;
  const id=pickFaceId(expression);
  if(id) face.setExpression(id);
}
const speechPlayer = MistSpeechPlayer.create({face, rate:()=>parseFloat($('ttsRate').value)||1,
  onState:(state,payload)=>{
    $('speechStatus').textContent=state==='idle'?'quiet':state==='blocked'?'Reply ready. Press Play reply.':state;
    $('btnPlayReply').hidden=state!=='blocked';
    if(payload) $('speechStatus').title=payload.provider+' · '+payload.alignment_source;
  },onError:message=>addNote(message),onTiming:event=>{
    const {stage,request_id,...details}=event;traceEvent(latencyTraces.get(request_id),stage,details);
  }});
const ttsAudio=speechPlayer.audio;
$('btnPlayReply').onclick=()=>speechPlayer.resume();
ttsAudio.id='speechAudio'; ttsAudio.hidden=true; document.body.appendChild(ttsAudio);
let browserSpeech=null;
function stopSpeech(){
  browserSpeech=null;
  if('speechSynthesis' in window) speechSynthesis.cancel();
  speechPlayer.stop();
}
function applyTtsRate(){speechPlayer.applyRate();}
function speak(reply,trace=null,purpose='manual'){
  if(!reply || $('ttsMode').value==='mute') return;
  if(speechPlayer.speech && speechPlayer.text===reply){speechPlayer.resume();return;}
  stopSpeech();
  const mode=$('ttsMode').value;
  if(mode==='browser'){
    if(!('speechSynthesis' in window)){addNote('Browser speech is unavailable.');return;}
    const utterance=new SpeechSynthesisUtterance(reply); browserSpeech=utterance;
    utterance.rate=parseFloat($('ttsRate').value)||1;
    utterance.onstart=()=>{
      if(browserSpeech!==utterance) return;
      $('speechStatus').textContent='speaking';
    };
    // Browser speech exposes no dependable playback clock or phoneme alignment.
    // Keep its expressive face still rather than inventing synchronization.
    utterance.onend=utterance.onerror=()=>{if(browserSpeech===utterance){browserSpeech=null;face.stopSpeech();$('speechStatus').textContent='quiet';}};
    speechSynthesis.speak(utterance); return;
  }
  trace=trace||newTrace();
  speechPlayer.play(reply,{provider:mode,voice:mode==='deepgram'?currentVoice:null,
    model:mode==='elevenlabs'&&!$('voiceModel').hidden?$('voiceModel').value:null,request_id:trace.id,purpose});
}

/* ---------------- chat log ---------------- */
const log = $('log');
function atBottom(){ return log.scrollHeight - log.scrollTop - log.clientHeight < 60; }
function scroll(){ log.scrollTop = log.scrollHeight; }

function addUser(text){
  const row = document.createElement('div'); row.className='row user';
  row.innerHTML = '<div class="who">you</div><div class="bubble">'+esc(text)+'</div>';
  log.appendChild(row); scroll();
}
function startBot(){
  const row = document.createElement('div'); row.className='row bot';
  const bubble = document.createElement('div'); bubble.className='bubble streaming';
  const who = document.createElement('div'); who.className='who'; who.textContent='MIST';
  const tools = document.createElement('div'); tools.className='tools';
  row.appendChild(who); row.appendChild(bubble); row.appendChild(tools);
  log.appendChild(row);
  curBot = {row, bubble, tools, text:'', chips:{}, metricsEl:null};
  const near = atBottom(); if (near) scroll();
}
function botDelta(delta){
  const trace=autoSpeechRequest?.trace;
  if(trace && !trace.events.some(event=>event.stage==='first_text_delta')) traceEvent(trace,'first_text_delta');
  if (!curBot) startBot();
  curBot.text += delta;
  curBot.bubble.textContent = curBot.text;   // textContent => XSS-safe
  curBot.bubble.classList.add('streaming');
  if (atBottom()) scroll();
}
function toolKey(name,args){ return name+'::'+JSON.stringify(args||{}); }
function fmtArgs(args){
  if (!args || !Object.keys(args).length) return '';
  return '{'+Object.entries(args).map(([k,v])=>esc(k)+': '+esc(JSON.stringify(v))).join(', ')+'}';
}
function toolStart(name,args){
  if (!curBot) startBot();
  const chip = document.createElement('span'); chip.className='tool pending';
  chip.innerHTML = '<span class="tn">'+esc(name)+'</span> <span class="ta">'+fmtArgs(args)+'</span>';
  curBot.tools.appendChild(chip);
  const key = toolKey(name,args);
  (curBot.chips[key] = curBot.chips[key] || []).push(chip);
  if (atBottom()) scroll();
  return chip;
}
function toolEnd(name,args,error){
  // The bus tail lags the RPC by up to 0.25 s, so a tool_end can land AFTER
  // turn_end already cleared curBot. Attach it to the just-finished turn
  // (lastBot) instead of spawning a fresh, never-finalized streaming bubble.
  let bot = curBot || lastBot;
  if (!bot){ startBot(); bot = curBot; }
  const key = toolKey(name,args);
  const queue = bot.chips[key] || [];
  let chip = queue.find(c => c.classList.contains('pending'));
  if (!chip){
    chip = document.createElement('span'); chip.className='tool';
    chip.innerHTML = '<span class="tn">'+esc(name)+'</span> <span class="ta">'+fmtArgs(args)+'</span>';
    bot.tools.appendChild(chip);
    (bot.chips[key] = queue).push(chip);
  }
  chip.classList.remove('pending');
  if (error) chip.classList.add('err');
}
function turnEnd(ev){
  const matchingRequest=!ev.request_id||ev.request_id===autoSpeechRequest?.trace.id;
  const trace=matchingRequest?autoSpeechRequest?.trace:null;
  traceEvent(trace,'model_end',{server_timing:ev.server_timing,backend_timings:ev.backend_timings});
  const serverConfirmed=autoSpeechRequest?.accepted || (ev.request_id && ev.request_id===autoSpeechRequest?.trace.id);
  const speakAutomatically=!!(matchingRequest && serverConfirmed && autoSpeechRequest?.echoMatched);
  if(matchingRequest) autoSpeechRequest=null;
  if (!curBot) startBot();
  curBot.bubble.classList.remove('streaming');
  // The final RPC reply is authoritative. Replace a partial delta stream after
  // a reconnect/drop instead of leaving a truncated sentence on screen.
  if (ev.reply){ curBot.text = ev.reply; curBot.bubble.textContent = ev.reply; }
  if (ev.cancelled) curBot.bubble.textContent = 'Reply stopped.';
  const react = (ev.ttf_any_s!=null ? ev.ttf_any_s
    : (ev.ttft_s!=null && ev.ttf_tool_s!=null) ? Math.min(ev.ttft_s, ev.ttf_tool_s)
    : (ev.ttft_s!=null?ev.ttft_s:ev.ttf_tool_s));
  const parts = [];
  if (react!=null) parts.push('react '+(+react).toFixed(1)+'s');
  if (ev.total_s!=null) parts.push('total '+(+ev.total_s).toFixed(1)+'s');
  const tok = (ev.output_tokens||0);
  if (tok) parts.push(tok+' tok');
  if (ev.cost_usd!=null && ev.cost_usd>0) parts.push('$'+(+ev.cost_usd).toFixed(4));
  if (ev.errors && ev.errors.length) parts.push('⚠ '+ev.errors.length+' err');
  const m = document.createElement('div'); m.className='metrics'; m.textContent = parts.join(' · ');
  curBot.row.appendChild(m);
  if(ev.reply && !ev.cancelled){
    const play=document.createElement('button');play.className='btn';play.textContent='Play reply';
    play.onclick=()=>speak(ev.reply);curBot.row.appendChild(play);
    if(speakAutomatically) speak(ev.reply,trace,'reply');
  }
  lastBot = curBot;   // let a late bus tool_end attach here, not a new bubble
  curBot = null;
  setBusy(false);
  if (atBottom()) scroll();
}
function addNote(text){
  const n = document.createElement('div'); n.className='note'; n.textContent=text;
  log.appendChild(n); if (atBottom()) scroll();
}

/* ---------------- SSE ---------------- */
function setConn(state){
  const dot=$('dot'), txt=$('connTxt');
  dot.className='dot '+(state==='live'?'live':(state==='dead'?'dead':''));
  txt.textContent = state==='live'?'live':(state==='dead'?'offline':'connecting');

function handle(ev){
  switch(ev.type){
    case 'hello':
      applyHello(ev); break;
    case 'chat_user':
      setBusy(true);
      // Server echoes every user turn. This tab already rendered its OWN sends
      // locally, so consume a matching pending echo; anything else came from
      // another connected client and should be shown.
      { const i = ev.request_id && ev.request_id!==autoSpeechRequest?.trace.id ? -1 : pendingEchoes.indexOf(ev.text);
        if (i >= 0){pendingEchoes.splice(i, 1);
          if(autoSpeechRequest?.text===ev.text) autoSpeechRequest.echoMatched=true;}
        else addUser(ev.text); }
      break;
    case 'text_delta': botDelta(ev.delta); break;
    case 'timing':
      if(!ev.request_id||ev.request_id===autoSpeechRequest?.trace.id) traceEvent(autoSpeechRequest?.trace,ev.phase||'backend_timing',{server:ev}); break;
    case 'face_expression': showFace(ev.expression);$('stFace').textContent=ev.expression;break;
    case 'tool_start': toolStart(ev.name, ev.args); break;
    case 'tool_end':
      toolEnd(ev.name, ev.args, ev.error);
      if (ev.name==='face' && ev.args && ev.args.expression) showFace(ev.args.expression);
      break;
    case 'turn_end': turnEnd(ev); break;
    case 'state': onState(ev); break;
    case 'sim': onSim(ev); break;
    case 'bench': onBench(ev.row||{}); break;
    case 'persona': applyPersona(ev); break;
    case 'profile': applyHello(ev);addNote('Conversation profile changed. Recent messages were retained.');break;
    case 'status_note': addNote(ev.text); break;
    case 'speech_stop': stopSpeech(); break;
    case 'job': renderJob(ev.job); break;
  }
}

/* ---------------- send ---------------- */
function setBusy(b){
  BUSY = b;
  $('input').disabled = CONFIG.mode==='watch';
  $('send').disabled = b || CONFIG.mode==='watch';
  // Don't let a new session (which resets the bus tail) fire mid-turn: that can
  // race the turn's _drain_bus window and drop its trailing tool/face events.
  $('btnNew').disabled = b;
  $('personaSel').disabled = b;
  $('profileSel').disabled = b;
  if(!b) $('input').focus();
  if(!b) for(const ready of [...replySlotWaiters]) ready(true);
}
function waitForReplySlot(signal){
  if(signal?.aborted) return Promise.resolve(false);
  if(!BUSY) return Promise.resolve(true);
  return new Promise(resolve=>{
    const finish=ok=>{replySlotWaiters.delete(finish);clearTimeout(timer);signal?.removeEventListener('abort',cancel);resolve(ok);};
    const cancel=()=>finish(false),timer=setTimeout(()=>finish(false),12000);
    replySlotWaiters.add(finish);signal?.addEventListener('abort',cancel,{once:true});
  });
}
function send(){return submitMessage($('input').value.trim());}
function submitMessage(text,{signal}={}){
  if (BUSY || CONFIG.mode==='watch' || signal?.aborted || !text) return Promise.resolve(false);
  stopSpeech();
  addUser(text);
  const request={text,accepted:false,echoMatched:false,trace:newTrace()};autoSpeechRequest=request;
  traceEvent(request.trace,'client_send');
  pendingEchoes.push(text);   // so the server's chat_user echo isn't rendered twice
  $('input').value='';
  setBusy(true);
  startBot();
  return fetch('/api/say', {method:'POST', headers:{'Content-Type':'application/json'},signal,
    body: JSON.stringify({text,request_id:request.trace.id})})
    .then(r => { traceEvent(request.trace,'server_accept_response',{status:r.status});
                 if(r.ok){if(autoSpeechRequest===request) request.accepted=true;return true;}
                 if(autoSpeechRequest===request) autoSpeechRequest=null;
                 const echo=pendingEchoes.indexOf(text);if(echo>=0) pendingEchoes.splice(echo,1);
                 addNote(r.status===409?'A reply is already running.':'Send failed ('+r.status+').');setBusy(false);return false; })
    .catch(error=>{if(autoSpeechRequest===request) autoSpeechRequest=null;
      const echo=pendingEchoes.indexOf(text);if(echo>=0) pendingEchoes.splice(echo,1);
      if(error.name!=='AbortError') addNote('Network error.');setBusy(false);return false;});
}
$('send').onclick = send;
$('input').addEventListener('keydown', e=>{
  if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});

function getTalkSession(){
  if(talkSession) return talkSession;
  if(!window.MistTalkCapture||!window.MistTalkSession||!window.MistTalkRecognition) throw new Error('Talk mode did not load. Reload this page.');
  const recognition=MistTalkRecognition.create({
    captureFactory:callbacks=>MistTalkCapture.create(callbacks),
    streamFactory:window.MistSTTStream&&CONFIG.stt_proxy_url!==null?callbacks=>MistSTTStream.create({...callbacks,url:CONFIG.stt_proxy_url||'ws://127.0.0.1:8788/stt'}):null,
    onRecognition:event=>{
      $('talkStatus').dataset.recognition=event.status;
      if(event.timings) $('talkStatus').dataset.recognitionTimings=JSON.stringify(event.timings);
      if(event.status==='streaming') $('talkStatus').title='Live speech recognition';
      if(event.status==='batch') $('talkStatus').title='Standard speech recognition fallback';
    },
    batchTranscribe:async(blob,meta)=>{
      const reply=await fetch('/api/stt',{method:'POST',headers:{'Content-Type':'audio/wav','X-Mist-Capture-Mode':'talk'},body:blob,signal:meta.signal});
      const result=await reply.json();
      if(!reply.ok) throw new Error(result.error||'Could not transcribe that utterance.');
      if(typeof result.confidence==='number' && result.confidence<.45) return '';
      return (result.transcript||'').trim();
    }
  });
  talkSession=MistTalkSession.create({
    captureFactory:recognition.captureFactory,
    transcribe:async(blob,meta)=>{
      $('talkStatus').dataset.lastUtterance=JSON.stringify({utteranceId:meta.utteranceId,durationMs:meta.durationMs,speechMs:meta.speechMs,
        preRollMs:meta.preRollMs,trailingSilenceMs:meta.trailingSilenceMs,bargeIn:meta.bargeIn,echoCancellation:meta.echoCancellation});
      return recognition.transcribe(blob,meta);
    },
    submit:async(text,{signal})=>{
      if(!await waitForReplySlot(signal)) return false;
      if(signal?.aborted) return false;
      return submitMessage(text,{signal});
    },
    interrupt:async({signal}={})=>{const reply=await fetch('/api/interrupt',{method:'POST',signal});if(!reply.ok) throw new Error('Could not interrupt the current reply.');},
    stopSpeech:()=>{autoSpeechRequest=null;stopSpeech();},
    isReplyBusy:()=>BUSY,
    isPlaybackActive:()=>!ttsAudio.paused||!!browserSpeech,
    onTranscript:text=>{$('input').value=text;},
    onState:updateTalkUI,
    onError:message=>addNote(typeof message==='string'?message:(message?.message||'Talk mode failed.'))
  });
  return talkSession;
}
$('btnTalk').onclick=async()=>{
  if(!CONFIG.deepgram_available) return;
  try{
    const session=getTalkSession();
    if(session.getState().active){autoSpeechRequest=null;stopSpeech();await session.stop();return;}
    stopSpeech();
    await session.start();
  }catch(error){addNote(error.message||'Could not start Talk mode.');updateTalkUI({status:'error',active:false});}
};
window.addEventListener?.('pagehide',()=>{talkSession?.stop();});
function setMicUI(state){   // 'idle' | 'rec' | 'busy'
  manualMicState=state;syncMicControls();
  const b = $('btnMic'); b.classList.remove('rec','busy');
  if (state==='rec'){ b.classList.add('rec'); b.textContent='■'; b.title='Stop & transcribe'; }
  else if (state==='busy'){ b.classList.add('busy'); b.textContent='…'; b.title='Transcribing…'; }
  else { b.textContent='🎤'; b.title='Click to talk, click again to stop'; }
}
async function toggleMic(){
  if (!CONFIG.deepgram_available){ addNote('mic needs a Deepgram key in .env'); return; }
  if (recording){ stopMic(); return; }
  stopSpeech();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder==='undefined'){
    addNote('mic recording not supported in this browser'); return;
  }
  let stream = null;
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    micChunks = [];
    const mr = new MediaRecorder(stream);
    mediaRecorder = mr;
    mr.ondataavailable = e=>{ if (e.data && e.data.size) micChunks.push(e.data); };
    mr.onstop = ()=>{
      stream.getTracks().forEach(t=>t.stop());
      if (!micChunks.length){ setMicUI('idle'); addNote('…heard nothing'); return; }
      transcribe(new Blob(micChunks, {type: mr.mimeType || micChunks[0].type || 'audio/webm'}));
    };
    mr.start(); recording = true; setMicUI('rec');
  }catch(e){
    // getUserMedia may have succeeded before MediaRecorder threw (unsupported
    // codec/container on some browsers) — release the mic so the device and the
    // tab's recording indicator don't stay stuck open, and don't leak a track on
    // the next click.
    if (stream){ try { stream.getTracks().forEach(t=>t.stop()); } catch(_){} }
    mediaRecorder = null; recording = false; setMicUI('idle');
    addNote('mic error: ' + (e && e.message ? e.message : 'unavailable'));
  }
}
function stopMic(){
  if (mediaRecorder && recording){ recording=false; setMicUI('busy'); try { mediaRecorder.stop(); } catch(e){} }
}
function transcribe(blob){
  fetch('/api/stt', {method:'POST', headers:{'Content-Type': blob.type||'audio/webm'}, body: blob})
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(d=>{
      setMicUI('idle');
      const t = (d.transcript||'').trim();
      if (!t){ addNote('…heard nothing — try again, closer to the mic'); return; }
      $('input').value = t;
      if ($('autoSend').checked) send();
      else $('input').focus();
    })
    .catch(err=>{ setMicUI('idle'); addNote('transcription failed ('+err+')'); });
}
$('btnMic').onclick = toggleMic;

/* ---------------- sim controls (debounced) ---------------- */
let simTimer=null, simPending={};
function pushSim(patch){
  // Accumulate into one pending patch so changing two different controls within
  // the debounce window doesn't drop the first one.
  Object.assign(simPending, patch);
  clearTimeout(simTimer);
  simTimer = setTimeout(()=>{
    const body = simPending; simPending = {};
    fetch('/api/sim', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)}).catch(()=>{});
  }, 300);
}
$('simBatt').oninput = e=>{ $('vBatt').textContent=e.target.value; pushSim({battery_pct:+e.target.value}); };
$('simTemp').oninput = e=>{ $('vTemp').textContent=e.target.value; pushSim({servo_temp_max_c:+e.target.value}); };
$('simSurf').onchange = e=>pushSim({surface:e.target.value});
$('simDelay').onchange = e=>pushSim({executive_delay_ms:+e.target.value});

/* ---------------- background tasks ---------------- */
const jobCards=new Map();
function renderJob(job){
  if(!job?.id) return;
  let card=jobCards.get(job.id);
  if(!card){card=document.createElement('article');card.className='job';card.dataset.jobId=job.id;$('jobs').appendChild(card);jobCards.set(job.id,card);}
  card.replaceChildren();
  const title=document.createElement('strong');title.textContent=job.status+' · '+job.task;card.appendChild(title);
  if(job.result){const text=document.createElement('p');text.textContent=job.result;card.appendChild(text);}
  if(job.grounding){const evidence=document.createElement('small');evidence.textContent=job.grounding+(job.elapsed_s?' · '+job.elapsed_s.toFixed(1)+'s':'');card.appendChild(evidence);}
  for(const limitation of job.limitations||[]){const note=document.createElement('p');note.textContent=limitation;card.appendChild(note);}
  for(const source of job.sources||[]){
    try{const url=new URL(source.url);if(!['http:','https:'].includes(url.protocol)) continue;
      const link=document.createElement('a');link.href=url.href;link.target='_blank';link.rel='noopener noreferrer';link.textContent=source.title||url.hostname;card.append(' · ',link);
    }catch(_){}
  }
  if(['queued','running'].includes(job.status)){
    const cancel=document.createElement('button');cancel.className='btn';cancel.textContent='Cancel task';
    cancel.onclick=()=>fetch('/api/jobs/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:job.id})}).then(r=>r.json()).then(d=>renderJob(d.job));card.append(' ',cancel);
  }
  if(job.result && job.status==='completed'){
    const read=document.createElement('button');read.className='btn';read.textContent='Read result';read.onclick=()=>speak(job.result);card.append(' ',read);
  }
  $('stTickets').textContent=[...jobCards.values()].filter(c=>/^(queued|running)/.test(c.textContent)).length;
}
$('btnTask').onclick=async()=>{
  const task=$('input').value.trim();if(!task) return;
  try{const r=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task})});
    const data=await r.json();if(!r.ok) throw new Error(data.error);$('input').value='';renderJob(data.job);$('input').focus();
  }catch(error){addNote(error.message||'Could not queue task.');}
};
$('btnStop').onclick=()=>{autoSpeechRequest=null;stopSpeech();fetch('/api/interrupt',{method:'POST'}).catch(()=>addNote('Stop request could not reach the server.'));};

/* ---------------- boot ---------------- */
fetch('/api/config').then(r=>r.json()).then(cfg=>{
  CONFIG = Object.assign(CONFIG, cfg);
  hydrateHistory(cfg.history);
  populateSpeechModels();
  if (cfg.voice) currentVoice = cfg.voice;
  populateVoices(cfg.voices || [], cfg.voice);
  populatePersonas(cfg.personas || [], cfg.soul);
  // restore saved preferences (voice / engine / speed) before defaults apply
  const savedVoice = loadPref('voice');
  if (savedVoice && (cfg.voices||[]).some(v=>v.id===savedVoice)){
    window.__voiceChosen = true; syncVoiceSelect(savedVoice);
  }
  const savedMode = loadPref('tts_mode');
  if (savedMode && [...$('ttsMode').options].some(o=>o.value===savedMode)
      && (savedMode !== 'deepgram' || cfg.deepgram_available)
      && (savedMode !== 'elevenlabs' || cfg.speech?.elevenlabs_available)){
    window.__ttsChosen = true; $('ttsMode').value = savedMode;
  }
  const savedRate = loadPref('rate');
  if (savedRate && [...$('ttsRate').options].some(o=>o.value===savedRate)){
    $('ttsRate').value = savedRate;
  }
  applyDeepgramAvailability();
}).catch(()=>{});
connect();
</script>
