document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

e companion to MIST_BUILD_PHASES.md · Rev. 2026-07<\u002Fdiv>\n      <div style=\"display: flex; align-items: center; gap: 14px; margin-top: 16px; font-family: 'IBM Plex Mono', monospace;\">\n        <div style=\"font-size: 13px; font-weight: 700; color: #0F766E; border: 2px solid #0F766E; border-radius: 4px; padding: 6px 12px; background: #E6F2F0;\">GATES PASSED: {{ passed }} / 16<\u002Fdiv>\n        <button onclick=\"{{ resetGates }}\" style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #6B675E; background: none; border: 1px solid #C9C4B8; border-radius: 4px; padding: 6px 10px; cursor: pointer;\">RESET<\u002Fbutton>\n        <div style=\"font-size: 10.5px; color: #6B675E;\">Tick each hard gate at the bench. Ticks persist on this device.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"height: 6px; background: #C4520A;\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ HOW TO READ ============ -->\n  <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0 0 26px 0;\">\n    <div style=\"border: 1.5px solid #211F1A; border-radius: 4px; padding: 14px 16px; background: #FCFAF5;\">\n      <div style=\"font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 17px; text-transform: uppercase; letter-spacing: 1px; color: #211F1A;\">Text beats pictures<\u002Fdiv>\n      <p style=\"margin: 6px 0 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.6; color: #3B3831;\">The panels are <em>orientation aids<\u002Fem>. If tiny image text or a drawn connector disagrees with <strong>MIST_BUILD_PHASES.md<\u002Fstrong>, <strong>MIST_FIELD_GUIDE.md<\u002Fstrong>, or the callouts here — <mark style=\"background: #F7E7B9; padding: 0 3px;\">follow the text<\u002Fmark>.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border: 1.5px solid #B42318; border-radius: 4px; padding: 14px 16px; background: #FBEAE8;\">\n      <div style=\"font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 17px; text-transform: uppercase; letter-spacing: 1px; color: #B42318;\">Do not jump ahead<\u002Fdiv>\n      <p style=\"margin: 6px 0 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.6; color: #5C1B15;\">Every panel assumes the previous phase’s <strong>hard gate<\u002Fstrong> passed. Skipping gates is how packs swell, caps pop, and servos cook.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ IMAGE STATUS NOTICE ============ -->\n  <div style=\"border: 1.5px dashed #C4520A; border-radius: 4px; padding: 14px 16px; margin: 0 0 26px 0; background: #FDF0E4;\">\n    <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: #C4520A;\">⚠ AI-GENERATED PANELS — FILES INTEGRATED<\u002Fdiv>\n    <p style=\"margin: 6px 0 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.6; color: #5A4632;\">The 17 panel files are now embedded from <strong>docs/mist/images/<\u002Fstrong>. They remain orientation aids: if image text or connector drawings disagree with the written callouts, follow the text. Three systemic errors were already caught and corrected in earlier review passes (see <a href=\"#image-review\">Image review notes<\u002Fa>).<\u002Fp>\n  <\u002Fdiv>\n\n  <!-- ============ VISUAL INDEX ============ -->\n  <div data-screen-label=\"Visual index\" style=\"margin: 0 0 34px 0;\">\n    <h2 style=\"margin: 0 0 10px 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 24px; text-transform: uppercase; letter-spacing: 1.5px; color: #211F1A; border-bottom: 3px solid #211F1A; padding-bottom: 5px;\">Visual index<\u002Fh2>\n    <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.5;\">\n      <div style=\"display: grid; grid-template-columns: 44px 168px 1fr; gap: 0 14px; padding: 5px 8px; color: #6B675E; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; border-bottom: 1.5px solid #211F1A;\"><span>Ph.<\u002Fspan><span>Panel<\u002Fspan><span>Main decision<\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 44px 168px 1fr; gap: 0 14px; padding: 6px 8px; border-bottom: 1px solid #E3DFD4;\"><a href=\"#phase-0\" style=\"font-weight: 700;\">00<\u002Fa><span>Missing parts<\u002Fspan><span style=\"color: #3B3831;\">No final harness or chassis until blockers are resolved.<\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 44px 168px 1fr; gap: 0 14px; padding: 6px 8px; border-bottom: 1px solid #E3DFD4; background: #FCFAF5;\"><a href=\"#phase-1\" style=\"font-weight: 700;\">01<\u002Fa><span>Package intake<\u002Fspan><span style=\"color: #3B3831;\">Count, photograph, label everything while disputes are possible.<\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 44px 168px 1fr; gap: 0 14px; padding: 6px 8px; border-bottom: 1px solid #E3DFD4;\"><a href=\"#phase-2\" style=\"font-weight: 700;\">02<\u002Fa><span>Safe bench<\u002Fspan><span style=\"color: #3B3831;\">Make the bench safe before LiPo power or soldering.<\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 44px 168px 1fr; gap: 0 14px; padding: 6px 8px; border-bottom: 1px solid #E3DFD4; background: #FCFAF5;\"><a href=\"#phase-3\" style=\"font-weight: 700;\">03<\u002Fa><span>Battery / charger<\u002Fspan><span style=\"color: #3B3831;\">Prove the balance-charge / storage workflow first.<\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 44px 168px 1fr; gap: 0 14px; padding: 6px 8px; border-bottom: 1px solid #E3DFD4;\"><a href=\"#phase-4\" style=\"font-weight: 700;\">04<\u002Fa><span>Electronics dry checks<\u002Fspan><span style=\"color: #3B3831;\">Verify UBEC 5V and USB data before servos.<\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 44px 168px 1fr; gap: 0 14px; padding: 6px 8px; border-bottom: 1px solid #E3DFD4; background: #FCFAF5;\"><a href=\"#phase-5\" style=\"font-weight: 700;\">05<\u002Fa><span>Servo intake<\u002Fspan><span style=\"color: #3B3831;\">Test, assign ID, and label one servo at a time.<\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 44px 168px 1fr; gap: 0 14px; padding: 6px 8px; border-bottom: 1px solid #E3DFD4;\"><a href=\"#phase-6\" style=\"font-weight: 700;\">06<\u002Fa><span>CAD / print coupons<\u002Fspan><span style=\"color: #3B3831;\">Fit-test coupons before full parts.<\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 44px 168px 1fr; gap: 0 14px; padding: 6px 8px; border-bottom: 1px solid #E3DFD4; background: #FCFAF5;\"><a href=\"#phase-7\" style=\"font-weight: 700;\">07<\u002Fa><span>Joint / wheel module<\u002Fspan><span style=\"color: #3B3831;\">Validate one joint and one wheel off the robot.<\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 44px 168px 1fr; gap: 0 14px; padding: 6px 8px; border-bottom: 1px solid #E3DFD4;\"><a href=\"#phase-8\" style=\"font-weight: 700;\">08<\u002Fa><span>Trunk / logic harness<\u002Fspan><span style=\"color: #3B3831;\">Main power spine, no servo branches yet.<\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 44px 168px 1fr; gap: 0 14px; padding: 6px 8px; border-bottom: 1px solid #E3DFD4; background: #FCFAF5;\"><a href=\"#phase-9\" style=\"font-weight: 700;\">09<\u002Fa><span>One leg branch<\u002Fspan><span style=\"color: #3B3831;\">One fused branch + signal tap before duplicating.<\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 44px 168px 1fr; gap: 0 14px; padding: 6px 8px; border-bottom: 1px solid #E3DFD4;\"><a href=\"#phase-10\" style=\"font-weight: 700;\">10<\u002Fa><span>Single leg test<\u002Fspan><span style=\"color: #3B3831;\">Static scan through stopper; motion only with stopper bypassed.<\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 44px 168px 1fr; gap: 0 14px; padding: 6px 8px; border-bottom: 1px solid #E3DFD4; background: #FCFAF5;\"><a href=\"#phase-11\" style=\"font-weight: 700;\">11<\u002Fa><span>Firmware integration<\u002Fspan><span style=\"color: #3B3831;\">ESP32 controls safely with torque-off / default guards.<\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 44px 168px 1fr; gap: 0 14px; padding: 6px 8px; border-bottom: 1px solid #E3DFD4;\"><a href=\"#phase-12\" style=\"font-weight: 700;\">12<\u002Fa><span>Full assembly<\u002Fspan><span style=\"color: #3B3831;\">Four legs, strain relief, separated voltage domains.<\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 44px 168px 1fr; gap: 0 14px; padding: 6px 8px; border-bottom: 1px solid #E3DFD4; background: #FCFAF5;\"><a href=\"#phase-13\" style=\"font-weight: 700;\">13<\u002Fa><span>Stand test<\u002Fspan><span style=\"color: #3B3831;\">Fuses out, static scan, then one branch at a time.<\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 44px 168px 1fr; gap: 0 14px; padding: 6px 8px; border-bottom: 1px solid #E3DFD4;\"><a href=\"#phase-14\" style=\"font-weight: 700;\">14<\u002Fa><span>Floor tests<\u002Fspan><span style=\"color: #3B3831;\">Low speed, kill path proven, no payload.<\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 44px 168px 1fr; gap: 0 14px; padding: 6px 8px; border-bottom: 1px solid #E3DFD4; background: #FCFAF5;\"><a href=\"#phase-15\" style=\"font-weight: 700;\">15<\u002Fa><span>Reliability loop<\u002Fspan><span style=\"color: #3B3831;\">Log, inspect, recharge safely, revise.<\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 44px 168px 1fr; gap: 0 14px; padding: 6px 8px;\"><a href=\"#integration-map\" style=\"font-weight: 700;\">∞<\u002Fa><span>Integration map<\u002Fspan><span style=\"color: #3B3831;\">The wiring authority. Read it before every harness session.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ LEGEND ============ -->\n  <div style=\"display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin: 0 0 34px 0; padding: 12px 14px; border: 1px solid #E3DFD4; border-radius: 4px; background: #FCFAF5; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #3B3831;\">\n    <span style=\"font-size: 10px; letter-spacing: 1.5px; color: #6B675E;\">CALLOUT KEY<\u002Fspan>\n    <span style=\"display: inline-flex; align-items: center; gap: 6px;\"><span style=\"font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #B42318; background: #FBEAE8; border: 1px solid #B42318; border-radius: 3px; padding: 1px 6px;\">SAFETY<\u002Fspan> can hurt you or the pack<\u002Fspan>\n    <span style=\"display: inline-flex; align-items: center; gap: 6px;\"><span style=\"font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan> non-negotiable build rule<\u002Fspan>\n    <span style=\"display: inline-flex; align-items: center; gap: 6px;\"><span style=\"font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E; background: #E6F2F0; border: 1px solid #0F766E; border-radius: 3px; padding: 1px 6px;\">CHECK<\u002Fspan> measure / verify before proceeding<\u002Fspan>\n    <span style=\"display: inline-flex; align-items: center; gap: 6px;\"><span style=\"font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #6B675E; background: #EFEDE7; border: 1px solid #A8A296; border-radius: 3px; padding: 1px 6px;\">NOTE<\u002Fspan> context / explanation<\u002Fspan>\n  <\u002Fdiv>\n\n  <!-- ============ PHASE 0 ============ -->\n  <section id=\"phase-0\" data-screen-label=\"Phase 0\" style=\"margin: 0 0 38px 0;\">\n    <header style=\"display: flex; align-items: baseline; gap: 16px; border-bottom: 3px solid #211F1A; padding-bottom: 6px;\">\n      <span style=\"font-family: 'Saira Stencil One', sans-serif; font-size: 46px; line-height: 0.9; color: #C4520A;\">00<\u002Fspan>\n      <div>\n        <h2 style=\"margin: 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase; letter-spacing: 1px; color: #211F1A;\">Missing-part check<\u002Fh2>\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 1.5px; color: #6B675E; text-transform: uppercase;\">Pre-build · a stop sign, not an assembly step<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n    <p style=\"margin: 12px 0 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-style: italic; line-height: 1.6; color: #6B675E;\">In plain terms: you already have most of the kit, but a few unglamorous items (raw wire, real screws, straps) block the <em>final<\u002Fem> harness and chassis. Decide what to do about each one before pretending they don’t exist.<\u002Fp>\n    <sc-if value=\"{{ showImages }}\" hint-placeholder-val=\"{{ true }}\">\n      <figure style=\"margin: 14px 0 0 0;\">\n        <img id=\"img-phase-00\" src=\"images/phase-00-missing-parts.png\" alt=\"phase 00 missing parts\" style=\"width: 100%; height: 300px; border: 1.5px solid #211F1A; display: block; object-fit: contain; border-radius: 4px; background: #FCFAF5;\">\n        <figcaption style=\"margin-top: 5px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.5px; color: #6B675E;\">AI PANEL · not yet verified — trust the callouts below over anything drawn in the image.<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fsc-if>\n    <ul style=\"list-style: none; margin: 14px 0 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 1.6; color: #211F1A;\">\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E; background: #E6F2F0; border: 1px solid #0F766E; border-radius: 3px; padding: 1px 6px;\">CHECK<\u002Fspan><span>Available / ordered: pigtails, XT90-S, fuses, capacitors, heat shrink, soldering kit, washers, self-tappers.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>Blockers stay real until physically confirmed: <mark style=\"background: #F7E7B9; padding: 0 3px;\">12/14/16AWG silicone wire<\u002Fmark>, M2/M3 machine screws, M3 nyloc nuts, usable metric hex keys, battery/phone straps, and <mark style=\"background: #F7E7B9; padding: 0 3px;\">known data-capable USB cables<\u002Fmark>.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #6B675E; background: #EFEDE7; border: 1px solid #A8A296; border-radius: 3px; padding: 1px 6px;\">NOTE<\u002Fspan><span>Pigtails are <strong>not<\u002Fstrong> a substitute for raw silicone wire. They help, but a clean harness still needs wire lengths you can cut to route.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>Self-tappers + washers are partial coverage only. Final frame joints get <strong>machine screws with locking nuts<\u002Fstrong> or heat-set inserts where the print allows.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #B42318; background: #FBEAE8; border: 1px solid #B42318; border-radius: 3px; padding: 1px 6px;\">SAFETY<\u002Fspan><span><strong>Do not floor-test if the LiPo is held by tape only.<\u002Fstrong><\u002Fspan><\u002Fli>\n    <\u002Ful>\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #E6F2F0; border: 1.5px solid #0F766E; border-left-width: 6px; padding: 10px 14px; margin: 16px 0 0 0; border-radius: 4px;\">\n      <button onclick=\"{{ t0 }}\" style=\"display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; padding: 0; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E;\"><span style=\"display: inline-flex; width: 18px; height: 18px; border: 2px solid #0F766E; border-radius: 3px; align-items: center; justify-content: center; background: #FFFFFF;\"><sc-if value=\"{{ g0 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width: 10px; height: 10px; background: #0F766E; display: block; border-radius: 1px;\"><\u002Fspan><\u002Fsc-if><\u002Fspan>PASSED<\u002Fbutton>\n      <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.55; color: #134E48;\"><strong>HARD GATE:<\u002Fstrong> consciously resolve or defer every blocker before Phase 1 turns into real assembly.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PHASE 1 ============ -->\n  <section id=\"phase-1\" data-screen-label=\"Phase 1\" style=\"margin: 0 0 38px 0;\">\n    <header style=\"display: flex; align-items: baseline; gap: 16px; border-bottom: 3px solid #211F1A; padding-bottom: 6px;\">\n      <span style=\"font-family: 'Saira Stencil One', sans-serif; font-size: 46px; line-height: 0.9; color: #C4520A;\">01<\u002Fspan>\n      <div>\n        <h2 style=\"margin: 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase; letter-spacing: 1px; color: #211F1A;\">Package intake<\u002Fh2>\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 1.5px; color: #6B675E; text-transform: uppercase;\">Count · photograph · label — while disputes are still possible<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n    <p style=\"margin: 12px 0 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-style: italic; line-height: 1.6; color: #6B675E;\">In plain terms: evidence first. A photo of the label next to the part is worth an entire refund dispute later, and mislabelled servos found now cost nothing.<\u002Fp>\n    <sc-if value=\"{{ showImages }}\" hint-placeholder-val=\"{{ true }}\">\n      <figure style=\"margin: 14px 0 0 0;\">\n        <img id=\"img-phase-01\" src=\"images/phase-01-package-intake.png\" alt=\"phase 01 package intake\" style=\"width: 100%; height: 300px; border: 1.5px solid #211F1A; display: block; object-fit: contain; border-radius: 4px; background: #FCFAF5;\">\n        <figcaption style=\"margin-top: 5px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.5px; color: #6B675E;\">AI PANEL · not yet verified — trust the callouts below over anything drawn in the image.<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fsc-if>\n    <ul style=\"list-style: none; margin: 14px 0 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 1.6; color: #211F1A;\">\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>Open <strong>one package at a time<\u002Fstrong>. Photograph the label, item, SKU, option, and any printed voltage/current marking.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E; background: #E6F2F0; border: 1px solid #0F766E; border-radius: 3px; padding: 1px 6px;\">CHECK<\u002Fspan><span>Count the expensive items immediately: <mark style=\"background: #F7E7B9; padding: 0 3px;\">18 servos<\u002Fmark>, <mark style=\"background: #F7E7B9; padding: 0 3px;\">2 LiPo packs<\u002Fmark>, FE-URT-1, Bus Servo Adapter A, ESP32 CP2102, B6Neo, PDB, UBECs, 5264 cable packs.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #6B675E; background: #EFEDE7; border: 1px solid #A8A296; border-radius: 3px; padding: 1px 6px;\">NOTE<\u002Fspan><span>Label bags: <code style=\"background: #EFEDE7; padding: 0 4px; border-radius: 3px;\">XT30<\u002Fcode> <code style=\"background: #EFEDE7; padding: 0 4px; border-radius: 3px;\">XT60<\u002Fcode> <code style=\"background: #EFEDE7; padding: 0 4px; border-radius: 3px;\">5264<\u002Fcode> <code style=\"background: #EFEDE7; padding: 0 4px; border-radius: 3px;\">fuses<\u002Fcode> <code style=\"background: #EFEDE7; padding: 0 4px; border-radius: 3px;\">caps<\u002Fcode> <code style=\"background: #EFEDE7; padding: 0 4px; border-radius: 3px;\">fasteners<\u002Fcode> <code style=\"background: #EFEDE7; padding: 0 4px; border-radius: 3px;\">servo horns<\u002Fcode> <code style=\"background: #EFEDE7; padding: 0 4px; border-radius: 3px;\">servo screws<\u002Fcode>.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #B42318; background: #FBEAE8; border: 1px solid #B42318; border-radius: 3px; padding: 1px 6px;\">SAFETY<\u002Fspan><span>Confirm every STS3215 says <mark style=\"background: #F7E7B9; padding: 0 3px;\">12V / 30kg / ST-3215-C018<\u002Fmark> (or equivalent 12V 30kg variant). A pack that looks like a <strong>7.4V variant<\u002Fstrong>: stop and document it before applying 3S voltage.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #B42318; background: #FBEAE8; border: 1px solid #B42318; border-radius: 3px; padding: 1px 6px;\">SAFETY<\u002Fspan><span>Inspect LiPos for swelling, crushed corners, damaged insulation, wrong connector. <strong>A damaged pack is not a test item.<\u002Fstrong><\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E; background: #E6F2F0; border: 1px solid #0F766E; border-radius: 3px; padding: 1px 6px;\">CHECK<\u002Fspan><span>5264 leads actually fit STS3215 ports. Generic PWM servo extensions <strong>do not count<\u002Fstrong> for the servo bus.<\u002Fspan><\u002Fli>\n    <\u002Ful>\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #E6F2F0; border: 1.5px solid #0F766E; border-left-width: 6px; padding: 10px 14px; margin: 16px 0 0 0; border-radius: 4px;\">\n      <button onclick=\"{{ t1 }}\" style=\"display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; padding: 0; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E;\"><span style=\"display: inline-flex; width: 18px; height: 18px; border: 2px solid #0F766E; border-radius: 3px; align-items: center; justify-content: center; background: #FFFFFF;\"><sc-if value=\"{{ g1 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width: 10px; height: 10px; background: #0F766E; display: block; border-radius: 1px;\"><\u002Fspan><\u002Fsc-if><\u002Fspan>PASSED<\u002Fbutton>\n      <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.55; color: #134E48;\"><strong>HARD GATE:<\u002Fstrong> every expensive item is counted, photographed, and either accepted or marked suspect.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PHASE 2 ============ -->\n  <section id=\"phase-2\" data-screen-label=\"Phase 2\" style=\"margin: 0 0 38px 0;\">\n    <header style=\"display: flex; align-items: baseline; gap: 16px; border-bottom: 3px solid #211F1A; padding-bottom: 6px;\">\n      <span style=\"font-family: 'Saira Stencil One', sans-serif; font-size: 46px; line-height: 0.9; color: #C4520A;\">02<\u002Fspan>\n      <div>\n        <h2 style=\"margin: 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase; letter-spacing: 1px; color: #211F1A;\">Safe bench setup<\u002Fh2>\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 1.5px; color: #6B675E; text-transform: uppercase;\">Make the bench safe before LiPo power or soldering<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n    <p style=\"margin: 12px 0 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-style: italic; line-height: 1.6; color: #6B675E;\">In plain terms: the bench is a system too. Separate the hot zone from the battery zone, and rehearse the boring skills (tinning, heat-shrink) on scrap before they meet real connectors.<\u002Fp>\n    <sc-if value=\"{{ showImages }}\" hint-placeholder-val=\"{{ true }}\">\n      <figure style=\"margin: 14px 0 0 0;\">\n        <img id=\"img-phase-02\" src=\"images/phase-02-safe-bench.png\" alt=\"phase 02 safe bench\" style=\"width: 100%; height: 300px; border: 1.5px solid #211F1A; display: block; object-fit: contain; border-radius: 4px; background: #FCFAF5;\">\n        <figcaption style=\"margin-top: 5px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.5px; color: #6B675E;\">AI PANEL · not yet verified — trust the callouts below over anything drawn in the image.<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fsc-if>\n    <ul style=\"list-style: none; margin: 14px 0 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 1.6; color: #211F1A;\">\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>Charging/storage area and soldering area are <strong>separate<\u002Fstrong>. The PVC cutting mat is for cutting and layout, <strong>not hot soldering<\u002Fstrong>.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #B42318; background: #FBEAE8; border: 1px solid #B42318; border-radius: 3px; padding: 1px 6px;\">SAFETY<\u002Fspan><span>LiPos sit in the <mark style=\"background: #F7E7B9; padding: 0 3px;\">LiPo bag<\u002Fmark> when charging or stored on the bench.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #B42318; background: #FBEAE8; border: 1px solid #B42318; border-radius: 3px; padding: 1px 6px;\">SAFETY<\u002Fspan><span>Remove rings and metal watch straps before handling batteries or live power leads.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>Keep <strong>one battery connected at a time<\u002Fstrong>.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #B42318; background: #FBEAE8; border: 1px solid #B42318; border-radius: 3px; padding: 1px 6px;\">SAFETY<\u002Fspan><span><strong>Never strip both battery leads at once.<\u002Fstrong> Finish and insulate one lead before touching the other.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E; background: #E6F2F0; border: 1px solid #0F766E; border-radius: 3px; padding: 1px 6px;\">CHECK<\u002Fspan><span>Meter probes parked in <code style=\"background: #EFEDE7; padding: 0 4px; border-radius: 3px;\">COM<\u002Fcode> and <code style=\"background: #EFEDE7; padding: 0 4px; border-radius: 3px;\">V/Ω<\u002Fcode>, not the current socket.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>The <mark style=\"background: #F7E7B9; padding: 0 3px;\">smoke stopper<\u002Fmark> and XT90-S/key path stay reachable before any powered harness test.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #6B675E; background: #EFEDE7; border: 1px solid #A8A296; border-radius: 3px; padding: 1px 6px;\">NOTE<\u002Fspan><span>Practice tinning and heat-shrinking scrap wire before any real connector.<\u002Fspan><\u002Fli>\n    <\u002Ful>\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #E6F2F0; border: 1.5px solid #0F766E; border-left-width: 6px; padding: 10px 14px; margin: 16px 0 0 0; border-radius: 4px;\">\n      <button onclick=\"{{ t2 }}\" style=\"display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; padding: 0; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E;\"><span style=\"display: inline-flex; width: 18px; height: 18px; border: 2px solid #0F766E; border-radius: 3px; align-items: center; justify-content: center; background: #FFFFFF;\"><sc-if value=\"{{ g2 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width: 10px; height: 10px; background: #0F766E; display: block; border-radius: 1px;\"><\u002Fspan><\u002Fsc-if><\u002Fspan>PASSED<\u002Fbutton>\n      <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.55; color: #134E48;\"><strong>HARD GATE:<\u002Fstrong> no LiPo-powered wiring until the smoke stopper is present and the meter/iron basics are proven.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PHASE 3 ============ -->\n  <section id=\"phase-3\" data-screen-label=\"Phase 3\" style=\"margin: 0 0 38px 0;\">\n    <header style=\"display: flex; align-items: baseline; gap: 16px; border-bottom: 3px solid #211F1A; padding-bottom: 6px;\">\n      <span style=\"font-family: 'Saira Stencil One', sans-serif; font-size: 46px; line-height: 0.9; color: #C4520A;\">03<\u002Fspan>\n      <div>\n        <h2 style=\"margin: 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase; letter-spacing: 1px; color: #211F1A;\">Battery &amp; charger commissioning<\u002Fh2>\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 1.5px; color: #6B675E; text-transform: uppercase;\">Prove the balance-charge / storage workflow first<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n    <p style=\"margin: 12px 0 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-style: italic; line-height: 1.6; color: #6B675E;\">In plain terms: the charger workflow is a skill you certify once, supervised, before these packs ever feed 18 servos. Wrong chemistry mode is the classic fire starter.<\u002Fp>\n    <sc-if value=\"{{ showImages }}\" hint-placeholder-val=\"{{ true }}\">\n      <figure style=\"margin: 14px 0 0 0;\">\n        <img id=\"img-phase-03\" src=\"images/phase-03-battery-charger.png\" alt=\"phase 03 battery charger\" style=\"width: 100%; height: 300px; border: 1.5px solid #211F1A; display: block; object-fit: contain; border-radius: 4px; background: #FCFAF5;\">\n        <figcaption style=\"margin-top: 5px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.5px; color: #6B675E;\">AI PANEL · not yet verified — trust the callouts below over anything drawn in the image.<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fsc-if>\n    <ul style=\"list-style: none; margin: 14px 0 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 1.6; color: #211F1A;\">\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E; background: #E6F2F0; border: 1px solid #0F766E; border-radius: 3px; padding: 1px 6px;\">CHECK<\u002Fspan><span>Use the B6Neo with the Anker 317 100W USB-C PD charger and a <mark style=\"background: #F7E7B9; padding: 0 3px;\">5A e-marked cable<\u002Fmark>.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>HOOVO pack settings: <mark style=\"background: #F7E7B9; padding: 0 3px;\">LiPo · 3S · 12.6V full · balance charge · 2.2A max first charge<\u002Fmark>.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #B42318; background: #FBEAE8; border: 1px solid #B42318; border-radius: 3px; padding: 1px 6px;\">SAFETY<\u002Fspan><span><strong>Never<\u002Fstrong> use LiHV or NiMH mode for these packs.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E; background: #E6F2F0; border: 1px solid #0F766E; border-radius: 3px; padding: 1px 6px;\">CHECK<\u002Fspan><span>Before first charge: meter the XT60 main lead and confirm the charger sees <strong>all 3 cells<\u002Fstrong> through the balance lead.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #B42318; background: #FBEAE8; border: 1px solid #B42318; border-radius: 3px; padding: 1px 6px;\">SAFETY<\u002Fspan><span>First charge stays <strong>supervised<\u002Fstrong>, in the LiPo bag, on a non-flammable surface.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span><strong>Storage-charge<\u002Fstrong> packs if you are not building within a few days.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #6B675E; background: #EFEDE7; border: 1px solid #A8A296; border-radius: 3px; padding: 1px 6px;\">NOTE<\u002Fspan><span>Remove the LiPo alarm after use — it slowly drains the pack in storage.<\u002Fspan><\u002Fli>\n    <\u002Ful>\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #E6F2F0; border: 1.5px solid #0F766E; border-left-width: 6px; padding: 10px 14px; margin: 16px 0 0 0; border-radius: 4px;\">\n      <button onclick=\"{{ t3 }}\" style=\"display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; padding: 0; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E;\"><span style=\"display: inline-flex; width: 18px; height: 18px; border: 2px solid #0F766E; border-radius: 3px; align-items: center; justify-content: center; background: #FFFFFF;\"><sc-if value=\"{{ g3 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width: 10px; height: 10px; background: #0F766E; display: block; border-radius: 1px;\"><\u002Fspan><\u002Fsc-if><\u002Fspan>PASSED<\u002Fbutton>\n      <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.55; color: #134E48;\"><strong>HARD GATE:<\u002Fstrong> each pack has sane per-cell voltages and the charger workflow is understood before it powers servos.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PHASE 4 ============ -->\n  <section id=\"phase-4\" data-screen-label=\"Phase 4\" style=\"margin: 0 0 38px 0;\">\n    <header style=\"display: flex; align-items: baseline; gap: 16px; border-bottom: 3px solid #211F1A; padding-bottom: 6px;\">\n      <span style=\"font-family: 'Saira Stencil One', sans-serif; font-size: 46px; line-height: 0.9; color: #C4520A;\">04<\u002Fspan>\n      <div>\n        <h2 style=\"margin: 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase; letter-spacing: 1px; color: #211F1A;\">Tool &amp; electronics dry checks<\u002Fh2>\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 1.5px; color: #6B675E; text-transform: uppercase;\">Verify UBEC 5V and USB data before servos<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n    <p style=\"margin: 12px 0 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-style: italic; line-height: 1.6; color: #6B675E;\">In plain terms: prove every low-voltage link on its own — a good 5V rail, a cable that actually carries data, a COM port that shows up — so servo debugging never has to guess about the basics.<\u002Fp>\n    <sc-if value=\"{{ showImages }}\" hint-placeholder-val=\"{{ true }}\">\n      <figure style=\"margin: 14px 0 0 0;\">\n        <img id=\"img-phase-04\" src=\"images/phase-04-electronics-dry-check.png\" alt=\"phase 04 electronics dry check\" style=\"width: 100%; height: 300px; border: 1.5px solid #211F1A; display: block; object-fit: contain; border-radius: 4px; background: #FCFAF5;\">\n        <figcaption style=\"margin-top: 5px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.5px; color: #6B675E;\">AI PANEL · not yet verified — trust the callouts below over anything drawn in the image.<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fsc-if>\n    <ul style=\"list-style: none; margin: 14px 0 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 1.6; color: #211F1A;\">\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E; background: #E6F2F0; border: 1px solid #0F766E; border-radius: 3px; padding: 1px 6px;\">CHECK<\u002Fspan><span>Verify each UBEC output before connecting logic. Accept roughly <mark style=\"background: #F7E7B9; padding: 0 3px;\">4.9–5.2V<\u002Fmark>.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E; background: #E6F2F0; border: 1px solid #0F766E; border-radius: 3px; padding: 1px 6px;\">CHECK<\u002Fspan><span>ESP32 first test is <strong>USB-only<\u002Fstrong>: data cable, COM port, blink or serial print.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span><strong>One ESP32 power source at a time<\u002Fstrong> by default. If laptop USB and UBEC 5V must coexist, use a verified power-blocked USB data lead or a cheap sacrificial USB hub.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #6B675E; background: #EFEDE7; border: 1px solid #A8A296; border-radius: 3px; padding: 1px 6px;\">NOTE<\u002Fspan><span>Bus Servo Adapter A dry check = pin identification + common-ground planning. <strong>No servos yet.<\u002Fstrong><\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>The adapter is <strong>never trusted<\u002Fstrong> as a high-current servo power path.<\u002Fspan><\u002Fli>\n    <\u002Ful>\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #E6F2F0; border: 1.5px solid #0F766E; border-left-width: 6px; padding: 10px 14px; margin: 16px 0 0 0; border-radius: 4px;\">\n      <button onclick=\"{{ t4 }}\" style=\"display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; padding: 0; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E;\"><span style=\"display: inline-flex; width: 18px; height: 18px; border: 2px solid #0F766E; border-radius: 3px; align-items: center; justify-content: center; background: #FFFFFF;\"><sc-if value=\"{{ g4 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width: 10px; height: 10px; background: #0F766E; display: block; border-radius: 1px;\"><\u002Fspan><\u002Fsc-if><\u002Fspan>PASSED<\u002Fbutton>\n      <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.55; color: #134E48;\"><strong>HARD GATE:<\u002Fstrong> a tested 5V UBEC, known data cable, and known ESP32 COM port exist before servo work.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PHASE 5 ============ -->\n  <section id=\"phase-5\" data-screen-label=\"Phase 5\" style=\"margin: 0 0 38px 0;\">\n    <header style=\"display: flex; align-items: baseline; gap: 16px; border-bottom: 3px solid #211F1A; padding-bottom: 6px;\">\n      <span style=\"font-family: 'Saira Stencil One', sans-serif; font-size: 46px; line-height: 0.9; color: #C4520A;\">05<\u002Fspan>\n      <div>\n        <h2 style=\"margin: 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase; letter-spacing: 1px; color: #211F1A;\">Servo intake, IDs &amp; register log<\u002Fh2>\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 1.5px; color: #6B675E; text-transform: uppercase;\">Test · assign ID · label — one servo at a time<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n    <p style=\"margin: 12px 0 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-style: italic; line-height: 1.6; color: #6B675E;\">In plain terms: all 18 servos ship with the same default ID. Put two on the bus at once and they talk over each other. One at a time, log, rename, label, next.<\u002Fp>\n    <sc-if value=\"{{ showImages }}\" hint-placeholder-val=\"{{ true }}\">\n      <figure style=\"margin: 14px 0 0 0;\">\n        <img id=\"img-phase-05\" src=\"images/phase-05-servo-id-registers.png\" alt=\"phase 05 servo id registers\" style=\"width: 100%; height: 300px; border: 1.5px solid #211F1A; display: block; object-fit: contain; border-radius: 4px; background: #FCFAF5;\">\n        <figcaption style=\"margin-top: 5px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.5px; color: #6B675E;\">AI PANEL · not yet verified — trust the callouts below over anything drawn in the image.<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fsc-if>\n    <ul style=\"list-style: none; margin: 14px 0 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 1.6; color: #211F1A;\">\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>Connect <strong>exactly one factory-default servo at a time<\u002Fstrong>. Multiple default-ID servos on one bus will collide.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #6B675E; background: #EFEDE7; border: 1px solid #A8A296; border-radius: 3px; padding: 1px 6px;\">NOTE<\u002Fspan><span>Use <strong>FE-URT-1<\u002Fstrong> for intake, ID assignment, register dump, and first motion tests.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>USB powers the adapter <strong>logic only<\u002Fstrong>. The servo still needs external servo power.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E; background: #E6F2F0; border: 1px solid #0F766E; border-radius: 3px; padding: 1px 6px;\">CHECK<\u002Fspan><span><strong>Log each servo’s default registers<\u002Fstrong> before changing anything.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #6B675E; background: #EFEDE7; border: 1px solid #A8A296; border-radius: 3px; padding: 1px 6px;\">NOTE<\u002Fspan><span>MIST ID map: <mark style=\"background: #F7E7B9; padding: 0 3px;\">FL 1–4 · FR 5–8 · RR 9–12 · RL 13–16 · spares 17–18<\u002Fmark>.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>Only the <strong>four wheel-role servos<\u002Fstrong> get wheel/continuous mode. Mode persists after power cycle — verify and label immediately.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #6B675E; background: #EFEDE7; border: 1px solid #A8A296; border-radius: 3px; padding: 1px 6px;\">NOTE<\u002Fspan><span>No horns during first intake sweeps.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #B42318; background: #FBEAE8; border: 1px solid #B42318; border-radius: 3px; padding: 1px 6px;\">SAFETY<\u002Fspan><span>Any servo whose protection/registers look like a <strong>7.4V variant<\u002Fstrong> stays off raw 3S until resolved.<\u002Fspan><\u002Fli>\n    <\u002Ful>\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #E6F2F0; border: 1.5px solid #0F766E; border-left-width: 6px; padding: 10px 14px; margin: 16px 0 0 0; border-radius: 4px;\">\n      <button onclick=\"{{ t5 }}\" style=\"display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; padding: 0; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E;\"><span style=\"display: inline-flex; width: 18px; height: 18px; border: 2px solid #0F766E; border-radius: 3px; align-items: center; justify-content: center; background: #FFFFFF;\"><sc-if value=\"{{ g5 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width: 10px; height: 10px; background: #0F766E; display: block; border-radius: 1px;\"><\u002Fspan><\u002Fsc-if><\u002Fspan>PASSED<\u002Fbutton>\n      <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.55; color: #134E48;\"><strong>HARD GATE:<\u002Fstrong> all 18 servos respond, move smoothly, have unique IDs, and are physically labelled.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PHASE 6 ============ -->\n  <section id=\"phase-6\" data-screen-label=\"Phase 6\" style=\"margin: 0 0 38px 0;\">\n    <header style=\"display: flex; align-items: baseline; gap: 16px; border-bottom: 3px solid #211F1A; padding-bottom: 6px;\">\n      <span style=\"font-family: 'Saira Stencil One', sans-serif; font-size: 46px; line-height: 0.9; color: #C4520A;\">06<\u002Fspan>\n      <div>\n        <h2 style=\"margin: 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase; letter-spacing: 1px; color: #211F1A;\">CAD measurement &amp; print coupons<\u002Fh2>\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 1.5px; color: #6B675E; text-transform: uppercase;\">Fit-test coupons before full parts<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n    <p style=\"margin: 12px 0 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-style: italic; line-height: 1.6; color: #6B675E;\">In plain terms: a coupon is a tiny throwaway print that tests one fit. Ten-minute coupons prevent ten-hour reprints of full legs.<\u002Fp>\n    <sc-if value=\"{{ showImages }}\" hint-placeholder-val=\"{{ true }}\">\n      <figure style=\"margin: 14px 0 0 0;\">\n        <img id=\"img-phase-06\" src=\"images/phase-06-cad-print-coupons.png\" alt=\"phase 06 cad print coupons\" style=\"width: 100%; height: 300px; border: 1.5px solid #211F1A; display: block; object-fit: contain; border-radius: 4px; background: #FCFAF5;\">\n        <figcaption style=\"margin-top: 5px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.5px; color: #6B675E;\">AI PANEL · not yet verified — trust the callouts below over anything drawn in the image.<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fsc-if>\n    <ul style=\"list-style: none; margin: 14px 0 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 1.6; color: #211F1A;\">\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>Measure the <strong>real<\u002Fstrong> servo body, mounting ears, horn spline/holes, cable exit, and screw locations. Do not trust listing dimensions.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E; background: #E6F2F0; border: 1px solid #0F766E; border-radius: 3px; padding: 1px 6px;\">CHECK<\u002Fspan><span>Coupons before full parts: servo pocket, screw boss, washer clearance, horn/hub fit, cable tunnel, wheel/tire interface.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #6B675E; background: #EFEDE7; border: 1px solid #A8A296; border-radius: 3px; padding: 1px 6px;\">NOTE<\u002Fspan><span>Material roles: <mark style=\"background: #F7E7B9; padding: 0 3px;\">PLA<\u002Fmark> = fast prototypes &amp; disposable fit checks · <mark style=\"background: #F7E7B9; padding: 0 3px;\">PETG<\u002Fmark> = load-bearing structure, servo pockets, brackets, hubs · <mark style=\"background: #F7E7B9; padding: 0 3px;\">TPU<\u002Fmark> = tires/feet after the PETG workflow is stable.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>Reprint at least one critical fit coupon <strong>in PETG<\u002Fstrong> before printing a full structural part. PLA clearances do not transfer perfectly.<\u002Fspan><\u002Fli>\n    <\u002Ful>\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #E6F2F0; border: 1.5px solid #0F766E; border-left-width: 6px; padding: 10px 14px; margin: 16px 0 0 0; border-radius: 4px;\">\n      <button onclick=\"{{ t6 }}\" style=\"display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; padding: 0; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E;\"><span style=\"display: inline-flex; width: 18px; height: 18px; border: 2px solid #0F766E; border-radius: 3px; align-items: center; justify-content: center; background: #FFFFFF;\"><sc-if value=\"{{ g6 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width: 10px; height: 10px; background: #0F766E; display: block; border-radius: 1px;\"><\u002Fspan><\u002Fsc-if><\u002Fspan>PASSED<\u002Fbutton>\n      <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.55; color: #134E48;\"><strong>HARD GATE:<\u002Fstrong> one PETG servo pocket and one horn/wheel coupon fit correctly before full legs are printed.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PHASE 7 ============ -->\n  <section id=\"phase-7\" data-screen-label=\"Phase 7\" style=\"margin: 0 0 38px 0;\">\n    <header style=\"display: flex; align-items: baseline; gap: 16px; border-bottom: 3px solid #211F1A; padding-bottom: 6px;\">\n      <span style=\"font-family: 'Saira Stencil One', sans-serif; font-size: 46px; line-height: 0.9; color: #C4520A;\">07<\u002Fspan>\n      <div>\n        <h2 style=\"margin: 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase; letter-spacing: 1px; color: #211F1A;\">Single joint &amp; wheel module<\u002Fh2>\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 1.5px; color: #6B675E; text-transform: uppercase;\">Validate one joint and one wheel off the robot<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n    <p style=\"margin: 12px 0 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-style: italic; line-height: 1.6; color: #6B675E;\">In plain terms: prove the mechanical unit in isolation. A joint that binds on the bench will bind worse on the robot — and software can only hide it, not fix it.<\u002Fp>\n    <sc-if value=\"{{ showImages }}\" hint-placeholder-val=\"{{ true }}\">\n      <figure style=\"margin: 14px 0 0 0;\">\n        <img id=\"img-phase-07\" src=\"images/phase-07-joint-wheel-module.png\" alt=\"phase 07 joint wheel module\" style=\"width: 100%; height: 300px; border: 1.5px solid #211F1A; display: block; object-fit: contain; border-radius: 4px; background: #FCFAF5;\">\n        <figcaption style=\"margin-top: 5px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.5px; color: #6B675E;\">AI PANEL · not yet verified — trust the callouts below over anything drawn in the image.<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fsc-if>\n    <ul style=\"list-style: none; margin: 14px 0 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 1.6; color: #211F1A;\">\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>Center every servo at <mark style=\"background: #F7E7B9; padding: 0 3px;\">position 2048<\u002Fmark> before fitting a horn or link.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E; background: #E6F2F0; border: 1px solid #0F766E; border-radius: 3px; padding: 1px 6px;\">CHECK<\u002Fspan><span>Build one joint module first. Check full range <strong>by hand<\u002Fstrong>, then under low-power command.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span><strong>No binding is acceptable.<\u002Fstrong> If the linkage binds, fix the print/CAD instead of masking it in software.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #6B675E; background: #EFEDE7; border: 1px solid #A8A296; border-radius: 3px; padding: 1px 6px;\">NOTE<\u002Fspan><span>Build one wheel module off the robot. Wheel mode is only for wheel-role servos.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E; background: #E6F2F0; border: 1px solid #0F766E; border-radius: 3px; padding: 1px 6px;\">CHECK<\u002Fspan><span>Cable exit must not pinch anywhere through the joint’s travel.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #6B675E; background: #EFEDE7; border: 1px solid #A8A296; border-radius: 3px; padding: 1px 6px;\">NOTE<\u002Fspan><span>This phase proves the mechanical unit, <strong>not<\u002Fstrong> the full leg harness.<\u002Fspan><\u002Fli>\n    <\u002Ful>\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #E6F2F0; border: 1.5px solid #0F766E; border-left-width: 6px; padding: 10px 14px; margin: 16px 0 0 0; border-radius: 4px;\">\n      <button onclick=\"{{ t7 }}\" style=\"display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; padding: 0; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E;\"><span style=\"display: inline-flex; width: 18px; height: 18px; border: 2px solid #0F766E; border-radius: 3px; align-items: center; justify-content: center; background: #FFFFFF;\"><sc-if value=\"{{ g7 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width: 10px; height: 10px; background: #0F766E; display: block; border-radius: 1px;\"><\u002Fspan><\u002Fsc-if><\u002Fspan>PASSED<\u002Fbutton>\n      <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.55; color: #134E48;\"><strong>HARD GATE:<\u002Fstrong> one joint and one wheel move smoothly off-load with correct mode and no cable pinch.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PHASE 8 ============ -->\n  <section id=\"phase-8\" data-screen-label=\"Phase 8\" style=\"margin: 0 0 38px 0;\">\n    <header style=\"display: flex; align-items: baseline; gap: 16px; border-bottom: 3px solid #211F1A; padding-bottom: 6px;\">\n      <span style=\"font-family: 'Saira Stencil One', sans-serif; font-size: 46px; line-height: 0.9; color: #C4520A;\">08<\u002Fspan>\n      <div>\n        <h2 style=\"margin: 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase; letter-spacing: 1px; color: #211F1A;\">Harness stage 1: trunk, PDB &amp; logic<\u002Fh2>\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 1.5px; color: #6B675E; text-transform: uppercase;\">Main power spine — no servo branches yet<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n    <p style=\"margin: 12px 0 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-style: italic; line-height: 1.6; color: #6B675E;\">In plain terms: build and prove the spine alone. Spine flow: <strong>LiPo → XT90-S → main fuse → smoke stopper (static first-power only) → PDB<\u002Fstrong>.<\u002Fp>\n    <sc-if value=\"{{ showImages }}\" hint-placeholder-val=\"{{ true }}\">\n      <figure style=\"margin: 14px 0 0 0;\">\n        <img id=\"img-phase-08\" src=\"images/phase-08-harness-trunk-logic.png\" alt=\"phase 08 harness trunk logic\" style=\"width: 100%; height: 300px; border: 1.5px solid #211F1A; display: block; object-fit: contain; border-radius: 4px; background: #FCFAF5;\">\n        <figcaption style=\"margin-top: 5px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.5px; color: #6B675E;\">AI PANEL · regenerated after wiring review; trust the callouts below.<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fsc-if>\n    <ul style=\"list-style: none; margin: 14px 0 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 1.6; color: #211F1A;\">\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>Leave PDB branch outputs <strong>empty<\u002Fstrong> in Phase 8. No leg branches, no servos.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E; background: #E6F2F0; border: 1px solid #0F766E; border-radius: 3px; padding: 1px 6px;\">CHECK<\u002Fspan><span>Measure raw battery voltage at the PDB before adding any logic load.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E; background: #E6F2F0; border: 1px solid #0F766E; border-radius: 3px; padding: 1px 6px;\">CHECK<\u002Fspan><span>UBEC input from raw 3S; UBEC output <strong>measured before<\u002Fstrong> it touches the ESP32.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>Label the UBEC output as <mark style=\"background: #F7E7B9; padding: 0 3px;\">5V<\u002Fmark>.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #B42318; background: #FBEAE8; border: 1px solid #B42318; border-radius: 3px; padding: 1px 6px;\">SAFETY<\u002Fspan><span>XT60/XT30 stay <strong>raw 3S only<\u002Fstrong>. Never build adapters that put raw battery voltage onto a 5V connector family.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #6B675E; background: #EFEDE7; border: 1px solid #A8A296; border-radius: 3px; padding: 1px 6px;\">NOTE<\u002Fspan><span>Bus Servo Adapter A is dry-checked/planned here; it carries <strong>no servo current<\u002Fstrong>.<\u002Fspan><\u002Fli>\n    <\u002Ful>\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #E6F2F0; border: 1.5px solid #0F766E; border-left-width: 6px; padding: 10px 14px; margin: 16px 0 0 0; border-radius: 4px;\">\n      <button onclick=\"{{ t8 }}\" style=\"display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; padding: 0; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E;\"><span style=\"display: inline-flex; width: 18px; height: 18px; border: 2px solid #0F766E; border-radius: 3px; align-items: center; justify-content: center; background: #FFFFFF;\"><sc-if value=\"{{ g8 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width: 10px; height: 10px; background: #0F766E; display: block; border-radius: 1px;\"><\u002Fspan><\u002Fsc-if><\u002Fspan>PASSED<\u002Fbutton>\n      <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.55; color: #134E48;\"><strong>HARD GATE:<\u002Fstrong> polarity, continuity, raw pack voltage, and verified 5V UBEC output all pass through the static smoke-stopper check.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PHASE 9 ============ -->\n  <section id=\"phase-9\" data-screen-label=\"Phase 9\" style=\"margin: 0 0 38px 0;\">\n    <header style=\"display: flex; align-items: baseline; gap: 16px; border-bottom: 3px solid #211F1A; padding-bottom: 6px;\">\n      <span style=\"font-family: 'Saira Stencil One', sans-serif; font-size: 46px; line-height: 0.9; color: #C4520A;\">09<\u002Fspan>\n      <div>\n        <h2 style=\"margin: 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase; letter-spacing: 1px; color: #211F1A;\">Harness stage 2: one leg branch<\u002Fh2>\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 1.5px; color: #6B675E; text-transform: uppercase;\">One fused branch + signal tap before duplicating<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n    <p style=\"margin: 12px 0 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-style: italic; line-height: 1.6; color: #6B675E;\">In plain terms: get one branch perfect, then copy it four times. Branch path: <strong>PDB XT30 out → branch fuse → 16AWG red/black → leg-root junction<\u002Fstrong>.<\u002Fp>\n    <sc-if value=\"{{ showImages }}\" hint-placeholder-val=\"{{ true }}\">\n      <figure style=\"margin: 14px 0 0 0;\">\n        <img id=\"img-phase-09\" src=\"images/phase-09-one-leg-branch.png\" alt=\"phase 09 one leg branch\" style=\"width: 100%; height: 300px; border: 1.5px solid #211F1A; display: block; object-fit: contain; border-radius: 4px; background: #FCFAF5;\">\n        <figcaption style=\"margin-top: 5px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.5px; color: #6B675E;\">AI PANEL · regenerated after wiring review; trust the callouts below.<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fsc-if>\n    <ul style=\"list-style: none; margin: 14px 0 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 1.6; color: #211F1A;\">\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>Build <strong>one branch only<\u002Fstrong> before duplicating anything.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>The <mark style=\"background: #F7E7B9; padding: 0 3px;\">4700µF capacitor<\u002Fmark> goes <strong>across<\u002Fstrong> positive and ground, in parallel. It is <strong>never inline<\u002Fstrong>.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #B42318; background: #FBEAE8; border: 1px solid #B42318; border-radius: 3px; padding: 1px 6px;\">SAFETY<\u002Fspan><span>Observe capacitor polarity. <strong>Reversed electrolytic capacitors fail violently.<\u002Fstrong><\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #6B675E; background: #EFEDE7; border: 1px solid #A8A296; border-radius: 3px; padding: 1px 6px;\">NOTE<\u002Fspan><span>The leg-root power tap sends <strong>V+ and GND<\u002Fstrong> to the servo chain.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>The controller/adapter side sends <strong>signal + common ground only<\u002Fstrong>. V+ from the adapter side is isolated.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E; background: #E6F2F0; border: 1px solid #0F766E; border-radius: 3px; padding: 1px 6px;\">CHECK<\u002Fspan><span>A brief continuity beep across + and GND can happen once the cap is installed; it should <strong>fade<\u002Fstrong>. A sustained beep is a short.<\u002Fspan><\u002Fli>\n    <\u002Ful>\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #E6F2F0; border: 1.5px solid #0F766E; border-left-width: 6px; padding: 10px 14px; margin: 16px 0 0 0; border-radius: 4px;\">\n      <button onclick=\"{{ t9 }}\" style=\"display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; padding: 0; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E;\"><span style=\"display: inline-flex; width: 18px; height: 18px; border: 2px solid #0F766E; border-radius: 3px; align-items: center; justify-content: center; background: #FFFFFF;\"><sc-if value=\"{{ g9 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width: 10px; height: 10px; background: #0F766E; display: block; border-radius: 1px;\"><\u002Fspan><\u002Fsc-if><\u002Fspan>PASSED<\u002Fbutton>\n      <div style=\"font-
