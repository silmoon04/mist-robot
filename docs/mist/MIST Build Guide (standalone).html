family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.55; color: #134E48;\"><strong>HARD GATE:<\u002Fstrong> one branch has correct polarity, correct fuse, correct cap orientation, and no sustained short before any servo is connected.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PHASE 10 ============ -->\n  <section id=\"phase-10\" data-screen-label=\"Phase 10\" style=\"margin: 0 0 38px 0;\">\n    <header style=\"display: flex; align-items: baseline; gap: 16px; border-bottom: 3px solid #211F1A; padding-bottom: 6px;\">\n      <span style=\"font-family: 'Saira Stencil One', sans-serif; font-size: 46px; line-height: 0.9; color: #C4520A;\">10<\u002Fspan>\n      <div>\n        <h2 style=\"margin: 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase; letter-spacing: 1px; color: #211F1A;\">Single-leg assembly &amp; test<\u002Fh2>\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 1.5px; color: #6B675E; text-transform: uppercase;\">Static scan through stopper · motion only with stopper bypassed<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n    <p style=\"margin: 12px 0 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-style: italic; line-height: 1.6; color: #6B675E;\">In plain terms: one full leg on a stand is the dress rehearsal. The smoke stopper protects static checks but lies under real servo load — know which mode you’re in.<\u002Fp>\n    <sc-if value=\"{{ showImages }}\" hint-placeholder-val=\"{{ true }}\">\n      <figure style=\"margin: 14px 0 0 0;\">\n        <img id=\"img-phase-10\" src=\"images/phase-10-single-leg-test.png\" alt=\"phase 10 single leg test\" style=\"width: 100%; height: 300px; border: 1.5px solid #211F1A; display: block; object-fit: contain; border-radius: 4px; background: #FCFAF5;\">\n        <figcaption style=\"margin-top: 5px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.5px; color: #6B675E;\">AI PANEL · regenerated after wiring review; trust the callouts below.<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fsc-if>\n    <ul style=\"list-style: none; margin: 14px 0 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 1.6; color: #211F1A;\">\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #6B675E; background: #EFEDE7; border: 1px solid #A8A296; border-radius: 3px; padding: 1px 6px;\">NOTE<\u002Fspan><span>Assemble one 3-joint leg plus one wheel <strong>on a stand<\u002Fstrong>, not on the full robot.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>Center each joint servo at <mark style=\"background: #F7E7B9; padding: 0 3px;\">2048<\u002Fmark> before fitting horns/links.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E; background: #E6F2F0; border: 1px solid #0F766E; border-radius: 3px; padding: 1px 6px;\">CHECK<\u002Fspan><span>Static ID scan <strong>may<\u002Fstrong> use the smoke stopper.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #B42318; background: #FBEAE8; border: 1px solid #B42318; border-radius: 3px; padding: 1px 6px;\">SAFETY<\u002Fspan><span>Any motion/load test must <strong>bypass the smoke stopper<\u002Fstrong>. Under servo current it drops voltage and creates false failures.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>Servo power comes from the <strong>fused leg branch<\u002Fstrong>, not from Bus Servo Adapter A. Adapter/controller side provides signal + common ground.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E; background: #E6F2F0; border: 1px solid #0F766E; border-radius: 3px; padding: 1px 6px;\">CHECK<\u002Fspan><span>Start with tiny jog commands and wheel spin <strong>off-load<\u002Fstrong>.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E; background: #E6F2F0; border: 1px solid #0F766E; border-radius: 3px; padding: 1px 6px;\">CHECK<\u002Fspan><span>Watch cable movement at every joint. Flex belongs in <strong>cable loops<\u002Fstrong>, not at connector exits.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E; background: #E6F2F0; border: 1px solid #0F766E; border-radius: 3px; padding: 1px 6px;\">CHECK<\u002Fspan><span>After short tests: feel cable, connector, fuse holder, and servo for warmth.<\u002Fspan><\u002Fli>\n    <\u002Ful>\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #E6F2F0; border: 1.5px solid #0F766E; border-left-width: 6px; padding: 10px 14px; margin: 16px 0 0 0; border-radius: 4px;\">\n      <button onclick=\"{{ t10 }}\" style=\"display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; padding: 0; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E;\"><span style=\"display: inline-flex; width: 18px; height: 18px; border: 2px solid #0F766E; border-radius: 3px; align-items: center; justify-content: center; background: #FFFFFF;\"><sc-if value=\"{{ g10 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width: 10px; height: 10px; background: #0F766E; display: block; border-radius: 1px;\"><\u002Fspan><\u002Fsc-if><\u002Fspan>PASSED<\u002Fbutton>\n      <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.55; color: #134E48;\"><strong>HARD GATE:<\u002Fstrong> one full leg moves through safe ranges without bus dropouts, binding, abnormal heat, or warm leg-root cables.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PHASE 11 ============ -->\n  <section id=\"phase-11\" data-screen-label=\"Phase 11\" style=\"margin: 0 0 38px 0;\">\n    <header style=\"display: flex; align-items: baseline; gap: 16px; border-bottom: 3px solid #211F1A; padding-bottom: 6px;\">\n      <span style=\"font-family: 'Saira Stencil One', sans-serif; font-size: 46px; line-height: 0.9; color: #C4520A;\">11<\u002Fspan>\n      <div>\n        <h2 style=\"margin: 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase; letter-spacing: 1px; color: #211F1A;\">Firmware integration<\u002Fh2>\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 1.5px; color: #6B675E; text-transform: uppercase;\">ESP32 controls safely with torque-off / default guards<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n    <p style=\"margin: 12px 0 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-style: italic; line-height: 1.6; color: #6B675E;\">In plain terms: the firmware’s first job is to do nothing dangerous by default. Torque off at boot, guards before choreography.<\u002Fp>\n    <sc-if value=\"{{ showImages }}\" hint-placeholder-val=\"{{ true }}\">\n      <figure style=\"margin: 14px 0 0 0;\">\n        <img id=\"img-phase-11\" src=\"images/phase-11-firmware-integration.png\" alt=\"phase 11 firmware integration\" style=\"width: 100%; height: 300px; border: 1.5px solid #211F1A; display: block; object-fit: contain; border-radius: 4px; background: #FCFAF5;\">\n        <figcaption style=\"margin-top: 5px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.5px; color: #6B675E;\">AI PANEL · regenerated after wiring review; trust the callouts below.<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fsc-if>\n    <ul style=\"list-style: none; margin: 14px 0 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 1.6; color: #211F1A;\">\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>Firmware starts with <mark style=\"background: #F7E7B9; padding: 0 3px;\">torque disabled by default<\u002Fmark>.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #6B675E; background: #EFEDE7; border: 1px solid #A8A296; border-radius: 3px; padding: 1px 6px;\">NOTE<\u002Fspan><span>ESP32 runs on verified 5V logic power; servos run on the separate raw 3S rail.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #B42318; background: #FBEAE8; border: 1px solid #B42318; border-radius: 3px; padding: 1px 6px;\">SAFETY<\u002Fspan><span>USB is for data/debug. <strong>Never power servos from USB or through the ESP32.<\u002Fstrong><\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span><strong>Common ground is mandatory<\u002Fstrong> between ESP32, adapter, UBEC, and servo rail.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E; background: #E6F2F0; border: 1px solid #0F766E; border-radius: 3px; padding: 1px 6px;\">CHECK<\u002Fspan><span>Use safe UART pins on the ESP32. <strong>Avoid strapping pins and flash pins.<\u002Fstrong><\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #6B675E; background: #EFEDE7; border: 1px solid #A8A296; border-radius: 3px; padding: 1px 6px;\">NOTE<\u002Fspan><span>First functions: bus scan, ID inventory, neutral command, wheel command, telemetry read, torque-off/deadman.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>EEPROM writes happen only in setup tools, <strong>never in the control loop<\u002Fstrong>.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E; background: #E6F2F0; border: 1px solid #0F766E; border-radius: 3px; padding: 1px 6px;\">CHECK<\u002Fspan><span>Add current/temperature/voltage guards <strong>before<\u002Fstrong> any multi-servo movement.<\u002Fspan><\u002Fli>\n    <\u002Ful>\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #E6F2F0; border: 1.5px solid #0F766E; border-left-width: 6px; padding: 10px 14px; margin: 16px 0 0 0; border-radius: 4px;\">\n      <button onclick=\"{{ t11 }}\" style=\"display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; padding: 0; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E;\"><span style=\"display: inline-flex; width: 18px; height: 18px; border: 2px solid #0F766E; border-radius: 3px; align-items: center; justify-content: center; background: #FFFFFF;\"><sc-if value=\"{{ g11 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width: 10px; height: 10px; background: #0F766E; display: block; border-radius: 1px;\"><\u002Fspan><\u002Fsc-if><\u002Fspan>PASSED<\u002Fbutton>\n      <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.55; color: #134E48;\"><strong>HARD GATE:<\u002Fstrong> firmware can scan expected IDs, torque off reliably, command neutral slowly, read telemetry, and stop on guard conditions.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PHASE 12 ============ -->\n  <section id=\"phase-12\" data-screen-label=\"Phase 12\" style=\"margin: 0 0 38px 0;\">\n    <header style=\"display: flex; align-items: baseline; gap: 16px; border-bottom: 3px solid #211F1A; padding-bottom: 6px;\">\n      <span style=\"font-family: 'Saira Stencil One', sans-serif; font-size: 46px; line-height: 0.9; color: #C4520A;\">12<\u002Fspan>\n      <div>\n        <h2 style=\"margin: 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase; letter-spacing: 1px; color: #211F1A;\">Full mechanical assembly<\u002Fh2>\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 1.5px; color: #6B675E; text-transform: uppercase;\">Four legs · strain relief · separated voltage domains<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n    <p style=\"margin: 12px 0 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-style: italic; line-height: 1.6; color: #6B675E;\">In plain terms: now duplicate the proven leg four times — and treat cable routing and battery retention as structural work, not an afterthought.<\u002Fp>\n    <sc-if value=\"{{ showImages }}\" hint-placeholder-val=\"{{ true }}\">\n      <figure style=\"margin: 14px 0 0 0;\">\n        <img id=\"img-phase-12\" src=\"images/phase-12-full-mechanical-assembly.png\" alt=\"phase 12 full mechanical assembly\" style=\"width: 100%; height: 300px; border: 1.5px solid #211F1A; display: block; object-fit: contain; border-radius: 4px; background: #FCFAF5;\">\n        <figcaption style=\"margin-top: 5px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.5px; color: #6B675E;\">AI PANEL · regenerated after wiring review; trust the callouts below.<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fsc-if>\n    <ul style=\"list-style: none; margin: 14px 0 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 1.6; color: #211F1A;\">\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>Assemble the chassis only after one leg passed <a href=\"#phase-10\">Phase 10<\u002Fa>.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #B42318; background: #FBEAE8; border: 1px solid #B42318; border-radius: 3px; padding: 1px 6px;\">SAFETY<\u002Fspan><span>The battery needs <strong>real straps<\u002Fstrong>. Tape is not retention.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>Keep XT90-S/key access <strong>reachable from outside the body<\u002Fstrong>.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #6B675E; background: #EFEDE7; border: 1px solid #A8A296; border-radius: 3px; padding: 1px 6px;\">NOTE<\u002Fspan><span>Raw 3S flow: battery → XT90-S → main fuse → PDB → four fused leg branches.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>UBEC 5V feeds <strong>logic only<\u002Fstrong>: ESP32, sensors, camera, similar low-voltage electronics. Bus Servo Adapter A carries signal/common reference, not leg servo current.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E; background: #E6F2F0; border: 1px solid #0F766E; border-radius: 3px; padding: 1px 6px;\">CHECK<\u002Fspan><span>A capacitor sits at <strong>each leg root<\u002Fstrong>, across V+ and GND.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>Add strain relief <strong>before<\u002Fstrong> tightening cable routes. Leave service loops where joints move.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #6B675E; background: #EFEDE7; border: 1px solid #A8A296; border-radius: 3px; padding: 1px 6px;\">NOTE<\u002Fspan><span>Threadlocker only after fit and range are proven.<\u002Fspan><\u002Fli>\n    <\u002Ful>\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #E6F2F0; border: 1.5px solid #0F766E; border-left-width: 6px; padding: 10px 14px; margin: 16px 0 0 0; border-radius: 4px;\">\n      <button onclick=\"{{ t12 }}\" style=\"display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; padding: 0; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E;\"><span style=\"display: inline-flex; width: 18px; height: 18px; border: 2px solid #0F766E; border-radius: 3px; align-items: center; justify-content: center; background: #FFFFFF;\"><sc-if value=\"{{ g12 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width: 10px; height: 10px; background: #0F766E; display: block; border-radius: 1px;\"><\u002Fspan><\u002Fsc-if><\u002Fspan>PASSED<\u002Fbutton>\n      <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.55; color: #134E48;\"><strong>HARD GATE:<\u002Fstrong> all four legs installed, cables restrained, voltage domains separated, and no connector can be pulled tight at full joint travel.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PHASE 13 ============ -->\n  <section id=\"phase-13\" data-screen-label=\"Phase 13\" style=\"margin: 0 0 38px 0;\">\n    <header style=\"display: flex; align-items: baseline; gap: 16px; border-bottom: 3px solid #211F1A; padding-bottom: 6px;\">\n      <span style=\"font-family: 'Saira Stencil One', sans-serif; font-size: 46px; line-height: 0.9; color: #C4520A;\">13<\u002Fspan>\n      <div>\n        <h2 style=\"margin: 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase; letter-spacing: 1px; color: #211F1A;\">Full robot stand test<\u002Fh2>\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 1.5px; color: #6B675E; text-transform: uppercase;\">Fuses out · static scan · then one branch at a time<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n    <p style=\"margin: 12px 0 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-style: italic; line-height: 1.6; color: #6B675E;\">In plain terms: first full power-up happens with the robot in the air and every branch fuse pulled. Add current paths one at a time, verifying as you go.<\u002Fp>\n    <sc-if value=\"{{ showImages }}\" hint-placeholder-val=\"{{ true }}\">\n      <figure style=\"margin: 14px 0 0 0;\">\n        <img id=\"img-phase-13\" src=\"images/phase-13-full-robot-stand-test.png\" alt=\"phase 13 full robot stand test\" style=\"width: 100%; height: 300px; border: 1.5px solid #211F1A; display: block; object-fit: contain; border-radius: 4px; background: #FCFAF5;\">\n        <figcaption style=\"margin-top: 5px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.5px; color: #6B675E;\">AI PANEL · regenerated after wiring review; trust the callouts below.<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fsc-if>\n    <ul style=\"list-style: none; margin: 14px 0 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 1.6; color: #211F1A;\">\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>Robot on stands so wheels and legs <strong>cannot load the floor<\u002Fstrong>.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #B42318; background: #FBEAE8; border: 1px solid #B42318; border-radius: 3px; padding: 1px 6px;\">SAFETY<\u002Fspan><span>Start with <strong>all branch fuses out<\u002Fstrong> and the robot unpowered. Meter rails before inserting fuses.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E; background: #E6F2F0; border: 1px solid #0F766E; border-radius: 3px; padding: 1px 6px;\">CHECK<\u002Fspan><span>Static first-power and ID scan can use the smoke stopper. <strong>Bypass it before motion.<\u002Fstrong><\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>Insert <strong>one leg branch fuse at a time<\u002Fstrong>; verify that leg before adding the next.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E; background: #E6F2F0; border: 1px solid #0F766E; border-radius: 3px; padding: 1px 6px;\">CHECK<\u002Fspan><span>Confirm all 16 installed IDs: <mark style=\"background: #F7E7B9; padding: 0 3px;\">1–4 · 5–8 · 9–12 · 13–16<\u002Fmark>.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #6B675E; background: #EFEDE7; border: 1px solid #A8A296; border-radius: 3px; padding: 1px 6px;\">NOTE<\u002Fspan><span>Test neutral pose, then no-load wheel pulses.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E; background: #E6F2F0; border: 1px solid #0F766E; border-radius: 3px; padding: 1px 6px;\">CHECK<\u002Fspan><span>Watch heat at servos, XT30s, fuse holders, capacitors, and cable exits.<\u002Fspan><\u002Fli>\n    <\u002Ful>\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #E6F2F0; border: 1.5px solid #0F766E; border-left-width: 6px; padding: 10px 14px; margin: 16px 0 0 0; border-radius: 4px;\">\n      <button onclick=\"{{ t13 }}\" style=\"display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; padding: 0; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E;\"><span style=\"display: inline-flex; width: 18px; height: 18px; border: 2px solid #0F766E; border-radius: 3px; align-items: center; justify-content: center; background: #FFFFFF;\"><sc-if value=\"{{ g13 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width: 10px; height: 10px; background: #0F766E; display: block; border-radius: 1px;\"><\u002Fspan><\u002Fsc-if><\u002Fspan>PASSED<\u002Fbutton>\n      <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.55; color: #134E48;\"><strong>HARD GATE:<\u002Fstrong> all 16 servos work together on stands without dropouts, abnormal current/temperature, or connector heating.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PHASE 14 ============ -->\n  <section id=\"phase-14\" data-screen-label=\"Phase 14\" style=\"margin: 0 0 38px 0;\">\n    <header style=\"display: flex; align-items: baseline; gap: 16px; border-bottom: 3px solid #211F1A; padding-bottom: 6px;\">\n      <span style=\"font-family: 'Saira Stencil One', sans-serif; font-size: 46px; line-height: 0.9; color: #C4520A;\">14<\u002Fspan>\n      <div>\n        <h2 style=\"margin: 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase; letter-spacing: 1px; color: #211F1A;\">First floor tests<\u002Fh2>\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 1.5px; color: #6B675E; text-transform: uppercase;\">Low speed · kill path proven · no payload<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n    <p style=\"margin: 12px 0 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-style: italic; line-height: 1.6; color: #6B675E;\">In plain terms: the robot earns floor time slowly. Before it moves an inch, you must be able to kill it instantly.<\u002Fp>\n    <sc-if value=\"{{ showImages }}\" hint-placeholder-val=\"{{ true }}\">\n      <figure style=\"margin: 14px 0 0 0;\">\n        <img id=\"img-phase-14\" src=\"images/phase-14-first-floor-tests.png\" alt=\"phase 14 first floor tests\" style=\"width: 100%; height: 300px; border: 1.5px solid #211F1A; display: block; object-fit: contain; border-radius: 4px; background: #FCFAF5;\">\n        <figcaption style=\"margin-top: 5px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.5px; color: #6B675E;\">AI PANEL · not yet verified — trust the callouts below over anything drawn in the image.<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fsc-if>\n    <ul style=\"list-style: none; margin: 14px 0 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 1.6; color: #211F1A;\">\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>First floor tests are <strong>low-speed and no-payload<\u002Fstrong>.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #B42318; background: #FBEAE8; border: 1px solid #B42318; border-radius: 3px; padding: 1px 6px;\">SAFETY<\u002Fspan><span><strong>Prove the kill path before motion.<\u002Fstrong> The XT90-S/key or battery disconnect must be reachable.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E; background: #E6F2F0; border: 1px solid #0F766E; border-radius: 3px; padding: 1px 6px;\">CHECK<\u002Fspan><span>Start with deadman/torque-off behaviour, then wheel pulses, crouch/stand, one-leg lift, a short straight roll.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>Top deck stays empty except required electronics. <strong>No phone/payload<\u002Fstrong> until base movement is stable.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E; background: #E6F2F0; border: 1px solid #0F766E; border-radius: 3px; padding: 1px 6px;\">CHECK<\u002Fspan><span>After each short run: heat at servos, XT30 connectors, fuse holders, leg-root capacitors, and UBEC.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #B42318; background: #FBEAE8; border: 1px solid #B42318; border-radius: 3px; padding: 1px 6px;\">SAFETY<\u002Fspan><span><strong>Stop on:<\u002Fstrong> drift, binding, reboot, missed IDs, repeated guard trips, warm connectors, or battery movement.<\u002Fspan><\u002Fli>\n    <\u002Ful>\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #E6F2F0; border: 1.5px solid #0F766E; border-left-width: 6px; padding: 10px 14px; margin: 16px 0 0 0; border-radius: 4px;\">\n      <button onclick=\"{{ t14 }}\" style=\"display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; padding: 0; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E;\"><span style=\"display: inline-flex; width: 18px; height: 18px; border: 2px solid #0F766E; border-radius: 3px; align-items: center; justify-content: center; background: #FFFFFF;\"><sc-if value=\"{{ g14 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width: 10px; height: 10px; background: #0F766E; display: block; border-radius: 1px;\"><\u002Fspan><\u002Fsc-if><\u002Fspan>PASSED<\u002Fbutton>\n      <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.55; color: #134E48;\"><strong>HARD GATE:<\u002Fstrong> the robot can move slowly and stop cleanly, with stable power and no hot spots.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PHASE 15 ============ -->\n  <section id=\"phase-15\" data-screen-label=\"Phase 15\" style=\"margin: 0 0 38px 0;\">\n    <header style=\"display: flex; align-items: baseline; gap: 16px; border-bottom: 3px solid #211F1A; padding-bottom: 6px;\">\n      <span style=\"font-family: 'Saira Stencil One', sans-serif; font-size: 46px; line-height: 0.9; color: #C4520A;\">15<\u002Fspan>\n      <div>\n        <h2 style=\"margin: 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase; letter-spacing: 1px; color: #211F1A;\">Reliability loop<\u002Fh2>\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 1.5px; color: #6B675E; text-transform: uppercase;\">Run → log → inspect → revise → repeat<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n    <p style=\"margin: 12px 0 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-style: italic; line-height: 1.6; color: #6B675E;\">In plain terms: the build never really ends — it converges. Stay in this loop until failures become boring and explainable.<\u002Fp>\n    <sc-if value=\"{{ showImages }}\" hint-placeholder-val=\"{{ true }}\">\n      <figure style=\"margin: 14px 0 0 0;\">\n        <img id=\"img-phase-15\" src=\"images/phase-15-reliability-loop.png\" alt=\"phase 15 reliability loop\" style=\"width: 100%; height: 300px; border: 1.5px solid #211F1A; display: block; object-fit: contain; border-radius: 4px; background: #FCFAF5;\">\n        <figcaption style=\"margin-top: 5px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.5px; color: #6B675E;\">AI PANEL · not yet verified — trust the callouts below over anything drawn in the image.<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fsc-if>\n    <ul style=\"list-style: none; margin: 14px 0 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 1.6; color: #211F1A;\">\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #B42318; background: #FBEAE8; border: 1px solid #B42318; border-radius: 3px; padding: 1px 6px;\">SAFETY<\u002Fspan><span>Charge or storage-charge LiPos <strong>in the LiPo bag<\u002Fstrong>, not loose on the bench.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E; background: #E6F2F0; border: 1px solid #0F766E; border-radius: 3px; padding: 1px 6px;\">CHECK<\u002Fspan><span>Record per session: runtime, recharge mAh, cell spread, servo temperatures, current/load peaks, resets, missed IDs, mechanical faults.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E; background: #E6F2F0; border: 1px solid #0F766E; border-radius: 3px; padding: 1px 6px;\">CHECK<\u002Fspan><span>Inspect after each session: fasteners, horns, connectors, fuse holders, caps, strain relief, tire wear, battery straps.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #C4520A; background: #FDF0E4; border: 1px solid #C4520A; border-radius: 3px; padding: 1px 6px;\">RULE<\u002Fspan><span>A warm connector, repeating fuse, overheating servo, or deforming print is a <strong>redesign trigger<\u002Fstrong>, not a quirk.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #6B675E; background: #EFEDE7; border: 1px solid #A8A296; border-radius: 3px; padding: 1px 6px;\">NOTE<\u002Fspan><span>Keep one known-good <mark style=\"background: #F7E7B9; padding: 0 3px;\">golden kit<\u002Fmark>: one servo, one cable, one adapter path, one branch harness.<\u002Fspan><\u002Fli>\n      <li style=\"display: flex; gap: 10px;\"><span style=\"flex: none; align-self: flex-start; margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; color: #6B675E; background: #EFEDE7; border: 1px solid #A8A296; border-radius: 3px; padding: 1px 6px;\">NOTE<\u002Fspan><span>Update CAD and wiring notes as soon as a change works. Threadlocker only after a joint has proven fit and range.<\u002Fspan><\u002Fli>\n    <\u002Ful>\n    <div style=\"display: flex; align-items: center; gap: 12px; background: #E6F2F0; border: 1.5px solid #0F766E; border-left-width: 6px; padding: 10px 14px; margin: 16px 0 0 0; border-radius: 4px;\">\n      <button onclick=\"{{ t15 }}\" style=\"display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; padding: 0; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 1px; color: #0F766E;\"><span style=\"display: inline-flex; width: 18px; height: 18px; border: 2px solid #0F766E; border-radius: 3px; align-items: center; justify-content: center; background: #FFFFFF;\"><sc-if value=\"{{ g15 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width: 10px; height: 10px; background: #0F766E; display: block; border-radius: 1px;\"><\u002Fspan><\u002Fsc-if><\u002Fspan>PASSED<\u002Fbutton>\n      <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.55; color: #134E48;\"><strong>HARD GATE:<\u002Fstrong> none — keep the robot in this phase until failures become boring and explainable.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ INTEGRATION MAP ============ -->\n  <section id=\"integration-map\" data-screen-label=\"Integration map\" style=\"margin: 0 0 38px 0; border: 2.5px solid #211F1A; border-radius: 4px; overflow: hidden;\">\n    <div style=\"height: 10px; background: repeating-linear-gradient(-45deg, #211F1A 0 12px, #E8A13A 12px 24px);\"><\u002Fdiv>\n    <div style=\"padding: 18px 20px 20px 20px; background: #FCFAF5;\">\n      <h2 style=\"margin: 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 28px; text-transform: uppercase; letter-spacing: 1.5px; color: #211F1A;\">Integration map <span style=\"color: #C4520A;\">— the wiring authority<\u002Fspan><\u002Fh2>\n      <sc-if value=\"{{ showImages }}\" hint-placeholder-val=\"{{ true }}\">\n        <figure style=\"margin: 14px 0 0 0;\">\n          <img id=\"img-integration-map\" src=\"images/integration-map.png\" alt=\"integration map\" style=\"width: 100%; height: 340px; border: 1.5px solid #211F1A; display: block; object-fit: contain; border-radius: 4px; background: #FCFAF5;\">\n          <figcaption style=\"margin-top: 5px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.5px; color: #6B675E;\">AI PANEL · regenerated after wiring review; reviewed; the list below is authoritative.<\u002Ffigcaption>\n        <\u002Ffigure>\n      <\u002Fsc-if>\n      <div style=\"display: grid; grid-template-columns: 108px 1fr; gap: 8px 14px; margin-top: 16px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 1.6; color: #211F1A;\">\n        <span style=\"font-weight: 700; color: #B42318;\">RAW 3S<\u002Fspan><span>LiPo → XT90-S anti-spark/key → main 30A fuse → XT60-to-8×XT30 PDB → four fused leg branches.<\u002Fspan>\n        <span style=\"font-weight: 700; color: #B42318;\">LEG BRANCH<\u002Fspan><span>Own fuse + local capacitor across V+/GND + power injection at the leg root.<\u002Fspan>\n        <span style=\"font-weight: 700; color: #C4520A;\">LOGIC 5V<\u002Fspan><span>UBEC converts raw 3S to 5V for ESP32, sensors, camera, and other low-voltage electronics <strong>only<\u002Fstrong>.<\u002Fspan>\n        <span style=\"font-weight: 700; color: #0F766E;\">SIGNAL<\u002Fspan><span>ESP32 UART → Bus Servo Adapter A → STS servo signal bus.<\u002Fspan>\n        <span style=\"font-weight: 700; color: #6B675E;\">GROUND<\u002Fspan><span>Raw power, UBEC, ESP32, adapter, and servo grounds share one common reference.<\u002Fspan>\n        <span style=\"font-weight: 700; color: #C4520A;\">ADAPTER<\u002Fspan><span>Provides signal/reference. <strong>Never<\u002Fstrong> the current path for leg servos.<\u002Fspan>\n        <span style=\"font-weight: 700; color: #B42318;\">DOMAINS<\u002Fspan><span>XT60/XT30 = raw 3S in this build. UBEC output = 5V, labelled separately.<\u002Fspan>\n        <span style=\"font-weight: 700; color: #0F766E;\">ID GROUPS<\u002Fspan><span>FL 1–4 · FR 5–8 · RR 9–12 · RL 13–16 · spares 17–18.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ IMAGE REVIEW NOTES ============ -->\n  <section id=\"image-review\" data-screen-label=\"Image review notes\" style=\"margin: 0 0 20px 0; border: 1.5px solid #A8A296; border-radius: 4px; padding: 18px 20px; background: #FCFAF5;\">\n    <h2 style=\"margin: 0; font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 24px; text-transform: uppercase; letter-spacing: 1.5px; color: #211F1A;\">Image review notes<\u002Fh2>\n    <p style=\"margin: 10px 0 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 1.65; color: #3B3831;\">The phase set was storyboarded by subsystem: intake/safety, electronics/harness, mechanical/firmware, and stand/floor/reliability. The wiring-critical panels (<a href=\"#phase-8\">08<\u002Fa>, <a href=\"#phase-9\">09<\u002Fa>, <a href=\"#phase-10\">10<\u002Fa>, <a href=\"#phase-11\">11<\u002Fa>, <a href=\"#phase-12\">12<\u002Fa>, <a href=\"#phase-13\">13<\u002Fa>, and the <a href=\"#integration-map\">integration map<\u002Fa>) were regenerated after review. Three systemic errors were caught:<\u002Fp>\n    <ol style=\"margin: 12px 0 0 0; padding: 0 0 0 22px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 1.65; color: #211F1A; display: flex; flex-direction: column; gap: 8px;\">\n      <li><strong style=\"color: #B42318;\">Smoke-stopper use<\u002Fstrong> — it appears only for static first-power / ID-scan checks, <strong>never<\u002Fstrong> as the path for real motion or load tests.<\u002Fli>\n      <li><strong style=\"color: #B42318;\">Adapter current<\u002Fstrong> — Bus Servo Adapter A is a signal / common-ground interface; servo current comes from fused raw-3S leg branches.<\u002Fli>\n      <li><strong style=\"color: #B42318;\">Voltage-domain separation<\u002Fstrong> — raw 3S, 5V logic, TTL signal, and common ground are treated as separate layers.<\u002Fli>\n    <\u002Fol>\n    <p style=\"margin: 12px 0 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.65; color: #6B675E; border-top: 1px dashed #C9C4B8; padding-top: 12px;\"><strong style=\"color: #C4520A;\">Per-image verification: integrated.<\u002Fstrong> The PNG files are embedded from the local images folder. Wiring-critical panels were regenerated and reviewed; keep treating the captions and phase text as authoritative over tiny generated labels.<\u002Fp>\n  <\u002Fsection>\n\n  <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 3px solid #211F1A; padding-top: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1.5px; color: #6B675E; text-transform: uppercase;\">\n    <span>MIST visual build guide · text is the source of truth<\u002Fspan>\n    <span>{{ passed }} / 16 gates passed<\u002Fspan>\n  <\u002Fdiv>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showImages&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Display&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    gates: (() => {\n      try { return JSON.parse(localStorage.getItem('mist-gates-v1')) || {}; }\n      catch (e) { return {}; }\n    })()\n  };\n\n  persist(gates) {\n    try { localStorage.setItem('mist-gates-v1', JSON.stringify(gates)); } catch (e) {}\n  }\n\n  toggle(i) {\n    this.setState(function (s) {\n      const gates = Object.assign({}, s.gates);\n      gates[i] = !gates[i];\n      return { gates: gates };\n    }, () => this.persist(this.state.gates));\n  }\n\n  renderVals() {\n    const v = { showImages: this.props.showImages ?? true };\n    let passed = 0;\n    for (let i = 0; i < 16; i++) {\n      const on = !!this.state.gates[i];\n      if (on) passed++;\n      v['g' + i] = on;\n      v['t' + i] = () => this.toggle(i);\n    }\n    v.passed = passed;\n    v.resetGates = () => {\n      if (confirm('Clear all 16 gate checkmarks?')) {\n        this.setState({ gates: {} }, () => this.persist({}));\n      }\n    };\n    return v;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
