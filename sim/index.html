<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MIST wheeled-quad simulator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #14161a; color: #d5d9e0; font: 13px/1.45 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
  #app { display: grid; grid-template-columns: 1fr 372px; grid-template-rows: 44px 1fr; height: 100vh; }
  #chips { grid-column: 1 / 3; display: flex; gap: 6px; align-items: center; padding: 6px 10px; background: #1a1d23; border-bottom: 1px solid #2a2e36; overflow-x: auto; white-space: nowrap; }
  .chip { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; background: #23272f; }
  .chip.ok { color: #4fdc8b; border: 1px solid #2a5c40; }
  .chip.warn { color: #f0b64c; border: 1px solid #6b5424; }
  .chip.bad { color: #ff6b5e; border: 1px solid #6b2c26; }
  #view { position: relative; overflow: hidden; }
  #view canvas { display: block; }
  .vlabel { position: absolute; left: 6px; color: #7d8494; font-size: 11px; font-weight: 700; letter-spacing: .08em; pointer-events: none; z-index: 2; }
  #panel { overflow-y: auto; background: #1a1d23; border-left: 1px solid #2a2e36; padding: 8px; }
  .group { background: #1f232b; border: 1px solid #2a2e36; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
  .gtitle { font-weight: 700; font-size: 12px; letter-spacing: .05em; color: #9aa3b5; text-transform: uppercase; cursor: pointer; margin-bottom: 4px; }
  details.group > summary::-webkit-details-marker { color: #5b6478; }
  .srow { display: grid; grid-template-columns: 1fr 110px 62px; align-items: center; gap: 6px; margin: 3px 0; }
  .slabel { color: #aab2c2; font-size: 12px; }
  .sval { color: #e8ecf4; font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: #4f8fe8; height: 20px; }
  .row { display: flex; gap: 6px; margin: 4px 0; flex-wrap: wrap; align-items: center; }
  select, button { background: #262b35; color: #d5d9e0; border: 1px solid #363c48; border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
  button:hover { background: #303743; }
  .check { display: block; margin: 3px 0; font-size: 12px; color: #aab2c2; cursor: pointer; }
  .kv { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; border-bottom: 1px dotted #2a2e36; font-size: 12px; }
  .kv b { color: #e8ecf4; font-weight: 600; text-align: right; }
  .tbar { display: grid; grid-template-columns: 62px 1fr 118px; gap: 6px; align-items: center; margin: 2px 0; font-size: 11px; }
  .tname { color: #8f97a8; }
  .track { background: #14161a; height: 10px; border-radius: 5px; overflow: hidden; position: relative; }
  .track::after { content: ''; position: absolute; left: 23%; top: 0; bottom: 0; width: 1px; background: #4a5162; } /* 30% cont mark (of 130% scale) */
  .fill { display: block; height: 100%; border-radius: 5px; }
  .fill.ok { background: #37c871; } .fill.warn { background: #e0a63c; } .fill.bad { background: #e0483c; }
  .tval { color: #c6ccd8; text-align: right; font-variant-numeric: tabular-nums; }
  .hint { color: #6d7586; font-size: 11px; margin-top: 4px; }
  .output { background: #14161a; border: 1px solid #2a2e36; border-radius: 6px; padding: 8px; font: 11px/1.5 Consolas, monospace; white-space: pre-wrap; max-height: 340px; overflow: auto; color: #c6ccd8; }
  #flagstrip { width: 100%; height: 26px; background: #14161a; border-radius: 4px; margin-top: 4px; }
  /* dashboard */
  .banner { border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; border: 1px solid; }
  .banner.ok { background: #16281e; border-color: #2a5c40; }
  .banner.warn { background: #2b2415; border-color: #6b5424; }
  .banner.bad { background: #2b1815; border-color: #6b2c26; }
  .bstate { font-weight: 800; font-size: 15px; letter-spacing: .06em; }
  .banner.ok .bstate { color: #4fdc8b; } .banner.warn .bstate { color: #f0b64c; } .banner.bad .bstate { color: #ff6b5e; }
  .bwhy { color: #aab2c2; font-size: 11.5px; margin-top: 2px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .card { background: #14161a; border: 1px solid #2a2e36; border-radius: 8px; padding: 7px 10px; border-left-width: 3px; }
  .card.ok { border-left-color: #37c871; } .card.warn { border-left-color: #e0a63c; } .card.bad { border-left-color: #e0483c; }
  .cval { font-size: 19px; font-weight: 700; color: #e8ecf4; font-variant-numeric: tabular-nums; }
  .cunit { font-size: 11px; color: #7d8494; font-weight: 500; margin-left: 4px; }
  .clabel { font-size: 11px; color: #8f97a8; }
  .gauge { background: #14161a; border: 1px solid #2a2e36; border-radius: 8px; padding: 7px 10px; margin-bottom: 6px; }
  .glabel { font-size: 11.5px; color: #aab2c2; margin-bottom: 4px; }
  .glabel b { font-variant-numeric: tabular-nums; }
  .gsvg { width: 100%; display: block; }
  .gtick { font-size: 7px; fill: #7d8494; font-family: inherit; }
  .dim { color: #6d7586; }
  .fbar { display: grid; grid-template-columns: 38px 1fr 70px; gap: 8px; align-items: center; margin: 3px 0; font-size: 11px; }
  .fname { color: #8f97a8; }
  .ftrack { position: relative; background: #1d2027; height: 9px; border-radius: 5px; overflow: hidden; }
  .ffill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; }
  .fmark { position: absolute; top: -2px; bottom: -2px; width: 1.5px; background: #ff6b5e; opacity: .8; }
  .fval { text-align: right; font-variant-numeric: tabular-nums; }
  .tiprow { display: flex; gap: 10px; align-items: center; }
  .tipsvg { width: 120px; height: 120px; flex: none; }
  .tipnote { font-size: 10.5px; color: #8f97a8; line-height: 1.5; }
  /* optimizer */
  .consgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin: 6px 0; }
  .cons { font-size: 11px; color: #aab2c2; display: flex; justify-content: space-between; align-items: center; gap: 4px; }
  .cons input { width: 58px; background: #262b35; color: #e8ecf4; border: 1px solid #363c48; border-radius: 4px; padding: 2px 5px; font-size: 11px; }
  .varsgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; margin: 4px 0; }
  .optrow { background: #14161a; border: 1px solid #2a2e36; border-radius: 8px; padding: 6px 9px; margin: 5px 0; font-size: 11px; border-left-width: 3px; }
  .optrow.ok { border-left-color: #37c871; } .optrow.warn { border-left-color: #e0a63c; }
  .opthead { display: flex; gap: 8px; align-items: center; color: #c6ccd8; }
  .opthead button { margin-left: auto; padding: 2px 10px; }
  .optvals { color: #aab2c2; margin: 3px 0; line-height: 1.6; }
  .optvals b { color: #e8ecf4; }
  .optmet { color: #7d8494; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/",
    "rapier": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.12.0/+esm"
  }
}
</script>
</head>
<body>
<div id="app">
  <div id="chips">loading…</div>
  <div id="view">
    <div class="vlabel" style="top:4px">SIDE</div>
    <div class="vlabel" style="top:33.5%">FRONT</div>
    <div class="vlabel" style="top:67%">TOP</div>
    <div class="vlabel" style="top:4px; left:28%">3D — drag to orbit, wheel to zoom</div>
  </div>
  <div id="panel"></div>
</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
